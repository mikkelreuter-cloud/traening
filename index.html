<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ECEDEF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1012" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0;font-size:14px}img{max-width:100%}</style>
<title>Styrke & VO₂ Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: soft grey canvas, white rounded cards with soft shadows, thin oversized numerals, orange accent, floating dark pill nav. */
:root{
  --bg:#ECEDEF; --surface:#FFFFFF; --surface-2:#F3F3F5; --fg:#17181B; --muted:#7D8089; --line:#E3E4E8;
  --accent:#F26A1B; --accent-2:#FF9A4D; --pill:#17181B; --pill-fg:#FFFFFF; --nav:#1C1D21; --nav-fg:#9C9EA6; --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgb(20 20 30 / .04),0 8px 24px rgb(20 20 30 / .06);
  --k-styrke:#2F6FEB; --k-interval:#F26A1B; --k-zone2:#14A37A; --k-hvile:#B3B5BC; --k-test:#E3B11B; --k-vaegt:#8B5CF6;
  --font:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:var(--font); --body:var(--font);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1012; --surface:#1B1C20; --surface-2:#25262B; --fg:#F2F2F4; --muted:#8E909A; --line:#2E3036;
  --accent:#FF7A2E; --accent-2:#FFA766; --pill:#F2F2F4; --pill-fg:#111214; --nav:#000000; --nav-fg:#8E909A; --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 8px 24px rgb(0 0 0 / .25);
  --k-styrke:#5B93FF; --k-interval:#FF8A3D; --k-zone2:#2FD3A0; --k-hvile:#6B6E77; --k-test:#F5CB45; --k-vaegt:#B394FF;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1012; --surface:#1B1C20; --surface-2:#25262B; --fg:#F2F2F4; --muted:#8E909A; --line:#2E3036;
  --accent:#FF7A2E; --accent-2:#FFA766; --pill:#F2F2F4; --pill-fg:#111214; --nav:#000000; --nav-fg:#8E909A; --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 8px 24px rgb(0 0 0 / .25);
  --k-styrke:#5B93FF; --k-interval:#FF8A3D; --k-zone2:#2FD3A0; --k-hvile:#6B6E77; --k-test:#F5CB45; --k-vaegt:#B394FF;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:18px calc(170px + env(safe-area-inset-bottom,0px))}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.brand{font-weight:400;font-size:16px;color:var(--muted);margin:0}
.hdate{font-weight:500;font-size:24px;line-height:1.15;margin:2px 0 0;text-wrap:balance;letter-spacing:-.01em}
.top-actions{display:flex;gap:8px}
#main{display:flex;flex-direction:column;gap:16px}
section{display:flex;flex-direction:column;gap:12px}

.card{background:var(--surface);border:0;border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.sess{font-weight:500;font-size:28px;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.015em}
.h2{font-weight:500;font-size:28px;margin:0;letter-spacing:-.015em}
.sec{font-weight:500;font-size:15px;color:var(--fg);margin:0}
.eyebrow{margin:0;font-size:13px;font-weight:400;color:var(--muted)}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px}

.k-styrke{--k:var(--k-styrke)} .k-interval{--k:var(--k-interval)} .k-zone2{--k:var(--k-zone2)}
.k-hvile{--k:var(--k-hvile)} .k-test{--k:var(--k-test)} .k-vaegt{--k:var(--k-vaegt)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--fg);white-space:nowrap;background:var(--surface-2);padding:5px 10px 5px 8px;border-radius:999px}
.chip i{width:9px;height:9px;border-radius:50%;border:2px solid var(--k)}

.ex{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ex li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 14px;background:var(--surface-2);border-radius:16px;align-items:baseline}
.exn{font-weight:500}
.exp{font-weight:300;font-size:24px;letter-spacing:-.02em}
.exp small{font-weight:500;font-size:11px;color:var(--muted);margin-left:6px;letter-spacing:.02em}
.exl{grid-column:1/-1;font-size:13px;color:var(--muted)}
.sug{grid-column:1/-1;font-size:14px;font-weight:500;color:var(--accent);margin:0}
.sugb{color:var(--accent);font-weight:600}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:st}
.steps li{counter-increment:st;display:flex;gap:12px;align-items:baseline;padding:12px 14px;background:var(--surface-2);border-radius:16px}
.steps li::before{content:counter(st);font-weight:300;font-size:20px;color:var(--accent);min-width:14px}
.note{margin:0;font-size:14px;color:var(--muted);line-height:1.5}
.done-msg{margin:0;font-weight:500;color:var(--k-zone2);font-size:14px}

.btn{appearance:none;border:0;border-radius:999px;padding:16px 18px;font:500 16px/1 var(--font);cursor:pointer;width:100%;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--nav);color:#fff}
.btn.accent{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent)}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.danger{background:transparent;color:var(--k-interval);border:1px solid currentColor}
.btn.danger.armed{background:var(--k-interval);color:#fff}

/* week strip: circles like a calendar */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{appearance:none;border:0;background:transparent;padding:2px 0;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--fg);font:inherit;cursor:pointer;min-width:0}
.wd .dl{font-size:12px;font-weight:400;color:var(--muted);text-transform:capitalize}
.wd{border-radius:999px;padding:8px 0 10px}
.wd .dn{font-weight:500;font-size:16px;line-height:1}
.wd.is-today{background:var(--pill);color:var(--pill-fg)}
.wd.is-today .dl{color:inherit;opacity:.7}
.wd.is-today .bar{border-color:var(--pill-fg)}
.wd.is-today.is-done .bar{background:var(--pill-fg)}
.bar{width:10px;height:10px;border-radius:50%;border:2.5px solid var(--k);background:transparent;flex:none}
.is-done .bar{background:var(--k)}
.k-hvile .bar{border-width:0;width:4px;height:4px;background:var(--k-hvile);margin:3px}
.dial{position:relative;width:100%;max-width:300px;margin:0 auto}
.dial svg{width:100%;max-width:300px;height:auto;display:block}
.dial rect{stroke:none} .dial .seg-off{fill:var(--surface-2)} .dial .seg-on{fill:var(--accent)}
.dial-c{position:absolute;left:0;right:0;bottom:6%;text-align:center;display:flex;flex-direction:column;align-items:center}
.dial-c .ic{color:var(--accent);font-size:16px;line-height:1}
.dial-c b{font-weight:500;font-size:34px;letter-spacing:-.02em;line-height:1.1}
.dial-c span{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--surface);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);min-width:0}
.stat .lab{font-size:13px;color:var(--muted);font-weight:400}
.stat b{font-weight:300;font-size:34px;line-height:1.15;letter-spacing:-.02em}
.stat b small{font-size:15px;font-weight:400;color:var(--muted);margin-left:2px}
.stat .meter{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.stat .meter i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--k-zone2))}
.stat em{font-style:normal;font-size:12px;color:var(--muted)}
.delta{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;vertical-align:middle;margin-left:6px;background:var(--surface-2);color:var(--muted)}
.banner{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);border-radius:22px;padding:16px 18px;box-shadow:var(--shadow)}
.banner .bi{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:13px;font-weight:600;margin-top:1px}
.banner p{margin:0;font-size:14px;line-height:1.45}
.banner b{font-weight:600;font-size:15px;display:block;margin-bottom:2px}
.banner button{appearance:none;border:0;background:rgb(255 255 255 / .22);color:inherit;border-radius:999px;padding:9px 14px;font:500 14px/1 var(--font);cursor:pointer;margin-top:10px}

.cal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.month{font-weight:500;font-size:22px;margin:0;text-transform:capitalize;letter-spacing:-.01em}
.icon-btn{appearance:none;border:0;background:var(--surface);color:var(--fg);width:44px;height:44px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer;flex:none;box-shadow:var(--shadow);display:grid;place-items:center}
.cal-card{padding:16px 12px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px 0}
.cw{text-align:center;font-size:12px;font-weight:400;color:var(--muted);padding-bottom:4px}
.cd{appearance:none;border:0;background:transparent;padding:9px 0 10px;width:44px;max-width:100%;justify-self:center;border-radius:999px;display:flex;flex-direction:column;align-items:center;gap:7px;font:inherit;color:var(--fg);cursor:pointer;min-width:0}
.cd .dn{font-weight:500;font-size:15px;line-height:1}
.cd.empty{cursor:default}
.cd.is-today .dn{color:var(--accent);font-weight:700}
.cd.is-sel{background:var(--pill);color:var(--pill-fg)}
.cd.is-sel .dn{color:inherit}
.cd.is-sel .bar{border-color:var(--pill-fg)}
.cd.is-sel.is-done .bar{background:var(--pill-fg)}
.cd.past:not(.is-done):not(.is-sel) .bar{opacity:.35}
.legend{display:flex;flex-wrap:wrap;gap:8px}

.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border-radius:999px;padding:5px;gap:4px;box-shadow:var(--shadow)}
.seg button{appearance:none;border:0;background:transparent;color:var(--muted);font:500 14px/1 var(--font);padding:11px 2px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--nav);color:#fff}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span,.trio span,.duo span{font-size:13px;font-weight:400;color:var(--muted)}
input,select,textarea{font:500 16px/1.3 var(--font);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;min-width:0}
.card input,.card select,.card textarea{background:var(--surface-2);border-color:transparent}
textarea{resize:vertical}
.trio,.duo,.quad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.duo{grid-template-columns:repeat(2,minmax(0,1fr))}
.trio label,.duo label{display:flex;flex-direction:column;gap:4px;min-width:0}
.formcard{gap:12px}

.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:24px minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) 46px;gap:6px;align-items:center;padding:6px;border-radius:16px;background:var(--surface-2)}
.set.head{background:transparent;padding-block:0}
.set.head span{font-size:12px;font-weight:400;color:var(--muted);text-align:center}
.set .sn{font-weight:300;font-size:20px;text-align:center;color:var(--muted)}
.card .set input{text-align:center;font-weight:500;padding:11px 4px;background:var(--surface);border-radius:12px}
.set input::placeholder{color:var(--muted);opacity:.7;font-weight:400}
.set .prev{grid-column:2/-1;font-size:12px;color:var(--muted);margin-top:-2px}
.chk{appearance:none;border:0;background:var(--surface);color:var(--muted);width:46px;height:44px;border-radius:12px;font-size:18px;font-weight:700;cursor:pointer}
.set.done{background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.set.done .chk{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
.set.done .sn{color:var(--accent)}
.setbtns{display:flex;gap:8px}
.setbtns .restbtn{flex:1}
.restbtn{appearance:none;border:0;background:var(--surface-2);color:var(--fg);border-radius:999px;padding:11px;font:500 14px/1 var(--font);cursor:pointer}
.restbar{position:fixed;left:50%;transform:translateX(-50%);width:min(calc(100% - 32px),488px);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--nav);color:#fff;padding:10px 10px 10px 20px;border-radius:999px;box-shadow:0 10px 30px rgb(0 0 0 / .25)}
#rest-t{font-weight:400;font-size:22px;color:var(--accent-2)}
.restbar button{appearance:none;border:0;background:rgb(255 255 255 / .12);color:#fff;border-radius:999px;padding:10px 16px;font:500 14px/1 var(--font);cursor:pointer}
.btns{display:grid;gap:8px}
.btns3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.btns3 .btn{padding:14px 6px}
.rt{margin:0;font-weight:500;font-size:17px}

/* timer: ring like an ECG recorder */
.timer{background:var(--surface);border-radius:28px;padding:22px 18px 26px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;box-shadow:var(--shadow);--ring:var(--muted)}
.timer.ph-work{--ring:var(--k-interval)} .timer.ph-rest{--ring:var(--k-zone2)} .timer.ph-easy{--ring:var(--accent)}
.timer .eyebrow{margin:0}
.tm-label{font-weight:500;font-size:22px;line-height:1.2;margin:0;text-wrap:balance}
.tm-ring{position:relative;width:min(72vw,280px);aspect-ratio:1;max-width:100%;margin:10px 0}
.tm-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tm-ring .trk{stroke:var(--surface-2)} .tm-ring .prg{stroke:var(--ring);transition:stroke-dashoffset .2s linear}
.tm-ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tm-time{font-weight:300;font-size:min(17vw,72px);line-height:1;margin:0;letter-spacing:-.03em}
.tm-ph{font-size:13px;font-weight:500;color:var(--ring)}
.tm-next{margin:0;font-size:14px;color:var(--muted)}

.rows{display:flex;flex-direction:column;gap:12px}
.srow{gap:12px;padding:16px}
.exin{font-weight:500;font-size:18px;background:transparent!important;border-color:transparent!important;padding:4px 2px}
.exin:focus{background:var(--surface-2)!important}
.x{appearance:none;border:0;background:var(--surface-2);color:var(--muted);width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;flex:none}
.hint{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
.field.inline{flex-direction:row;align-items:center;justify-content:space-between;gap:12px}
.field.inline>span{font-size:15px;color:var(--fg);font-weight:400}
.field.inline select{width:auto;max-width:62%}

.log{display:flex;flex-direction:column;gap:3px;padding:14px 0;border-top:1px solid var(--line)}
.log:first-child{border-top:0;padding-top:0}
.log:last-child{padding-bottom:0}
.log .meta{display:flex;align-items:center;gap:10px}
.log .lt{margin:0;font-weight:500}
.log .ld{margin:0;font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.del{appearance:none;border:0;background:var(--surface-2);color:var(--muted);font:500 13px var(--font);padding:7px 12px;border-radius:999px;cursor:pointer;margin-left:auto}
.del.confirm{background:var(--k-interval);color:#fff}

.big{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px}
.big b{font-weight:300;font-size:52px;line-height:1;letter-spacing:-.03em}
.big span{font-weight:400;color:var(--muted)}
.big em{font-style:normal;font-size:14px;color:var(--muted);flex-basis:100%}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}
.chart .ln{stroke:var(--k);stroke-width:2.4;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--k);opacity:.14}
.chart .pt{fill:var(--k)}
.chart .end{fill:var(--surface);stroke:var(--k);stroke-width:3}
.chart text{fill:var(--muted);font:400 10px var(--font)}
.chart text.ev{fill:var(--fg);font-weight:600;font-size:11px}
.empty{margin:0;color:var(--muted);font-size:14px}
.warn{margin:0;background:var(--k-interval);color:#fff;padding:12px 14px;border-radius:16px;font-weight:500;font-size:14px}
.facts{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}

/* floating dark pill nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.tabs .in{pointer-events:auto;max-width:360px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);background:var(--nav);border-radius:999px;padding:7px;box-shadow:0 12px 30px rgb(0 0 0 / .28)}
.tab{appearance:none;border:0;background:transparent;color:var(--nav-fg);font:500 11px/1 var(--font);height:56px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
.tab svg,.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom,0px));background:var(--nav);color:#fff;padding:11px 18px;border-radius:999px;font-weight:500;font-size:14px;z-index:6;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 30px rgb(0 0 0 / .25)}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div>
      <p class="brand" id="hdr-hi">Hej Mikkel!</p>
      <h1 class="hdate" id="hdr-date">I dag</h1>
    </div>
    <button class="icon-btn" data-act="settings" aria-label="Plan og data">
      <svg viewBox="0 0 24 24"><path d="M4 7h9M18 7h2M4 17h4M13 17h7"/><circle cx="15.5" cy="7" r="2.3"/><circle cx="10.5" cy="17" r="2.3"/></svg>
    </button>
  </header>
  <main id="main"></main>
</div>

<nav class="tabs" aria-label="Sider">
  <div class="in">
    <button class="tab" data-act="view" data-view="today"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>I dag</button>
    <button class="tab" data-act="view" data-view="cal"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Kalender</button>
    <button class="tab" data-act="view" data-view="log"><svg viewBox="0 0 24 24"><path d="M6.5 9v6M17.5 9v6M3.5 10.5v3M20.5 10.5v3M6.5 12h11"/></svg>Log</button>
    <button class="tab" data-act="view" data-view="prog"><svg viewBox="0 0 24 24"><path d="M5 20V12M10 20V6M15 20v-9M20 20V9"/></svg>Udvikling</button>
  </div>
</nav>
<div class="restbar" id="restbar" hidden><span id="rest-t" class="num">Pause</span><button data-act="reststop">Stop</button></div>
<div class="toast" id="toast" hidden></div>

<script>
const KEY='styrke-vo2-log.v1';
const DAYS=['søndag','mandag','tirsdag','onsdag','torsdag','fredag','lørdag'];
const MONTHS=['januar','februar','marts','april','maj','juni','juli','august','september','oktober','november','december'];
const KIND_LABEL={styrke:'Styrke',interval:'Intervaller',zone2:'Zone 2',hvile:'Hvile'};
const LOGTYPE={styrke:'Styrke',kondition:'Kondition',vaegt:'Vægt',test:'Test'};
const TESTS=['3 km løb','5 km løb','Cooper 12 min','1RM squat','1RM bænkpres','1RM dødløft','Max pull-ups','VO₂max (ur)'];

const SESS={
  A:{name:'Styrke A',kind:'styrke',dur:'ca. 60 min',ex:[['Squat',4,5,2],['Bænkpres',4,5,2],['Rotræk med stang',3,8,1],['Bulgarsk splitsquat',3,8,2]],
     note:'Stop hvert sæt med det antal reps i reserve (RIR), der står. Log din RIR på sidste sæt, så foreslår appen næste gangs vægt.'},
  B:{name:'Styrke B',kind:'styrke',dur:'ca. 60 min',ex:[['Dødløft',3,5,3],['Militærpres',4,5,2],['Pull-ups',4,6,1],['Hip thrust',3,8,1]],
     note:'Dødløft med RIR 3, så teknikken holder. Pull-ups får ekstra vægt, når appen foreslår det.'},
  C:{name:'Styrke C',kind:'styrke',dur:'ca. 50 min',ex:[['Frontsquat',3,6,2],['Skrå håndvægtpres',3,8,1],['Chin-ups',3,8,1],['Rumænsk dødløft',3,8,2]],
     note:'Moderat tungt. Fokus på teknik og fart op i løftet.'},
  I4:{name:'Intervaller 4×4',kind:'interval',dur:'ca. 40 min',
     steps:['10 min opvarmning, roligt','4 × 4 min hårdt ved 90–95 % af maks puls (RPE 9)','3 min aktiv pause mellem hvert interval','5 min nedvarmning'],
     note:'Lange intervaller (2 min eller mere) med mindst 15 min arbejde gav de største VO₂max-fremskridt. Cykel eller romaskine skåner benene til styrke.'},
  I30:{name:'Korte intervaller 30/15',kind:'interval',dur:'ca. 35 min',
     steps:['10 min opvarmning','3 serier × 10 × (30 sek hårdt / 15 sek let)','3 min pause mellem serierne','5 min nedvarmning'],
     note:'Korte, meget hårde intervaller med kort pause rangerer højt for trænede.'},
  Z2:{name:'Zone 2',kind:'zone2',dur:'45–60 min',
     steps:['45–60 min roligt løb, cykel eller ro','60–70 % af maks puls','Du skal kunne tale i hele sætninger'],
     note:'Bygger den aerobe base og hjælper restitutionen. Den kan springes over, hvis tiden er knap.'},
  R:{name:'Hvile',kind:'hvile',dur:'',steps:['Gåtur eller let mobilitet','Søvn og mad er dagens træning'],note:''}
};
const DEFAULT_PLAN={0:'R',1:'A',2:'I4',3:'B',4:'Z2',5:'C',6:'I30'};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
let TODAY=ds(new Date());
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isFinite(n)?n:null};
const fnum=(n,dec=1)=>(Math.round(n*10**dec)/10**dec).toString().replace('.',',');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function parseTime(s){s=String(s??'').trim();if(!s)return null;const p=s.split(/[:.]/).map(x=>num(x));if(p.some(x=>x===null))return null;return p.reduce((a,b)=>a*60+b,0)}
function fmtTime(sec){sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${h}:${pad(m)}:${pad(s)}`:`${m}:${pad(s)}`}
const e1rm=(kg,reps)=>kg*(1+reps/30);
const niceDate=s=>{const d=pd(s);return `${DAYS[d.getDay()]} ${d.getDate()}. ${MONTHS[d.getMonth()]}`};
const shortDate=s=>{const d=pd(s);return `${d.getDate()}/${d.getMonth()+1}`};
const fmtVal=(v,u)=>u==='tid'?fmtTime(v):fnum(v,2)+' '+u;
const chip=(k,label)=>`<span class="chip k-${k}"><i></i>${label}</span>`;

/* ---------- storage ---------- */
let storageOK=true;
try{localStorage.setItem('__t','1');localStorage.removeItem('__t')}catch(e){storageOK=false}
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);return {plan:{...DEFAULT_PLAN,...(d.plan||{})},logs:Array.isArray(d.logs)?d.logs:[],lastBackup:d.lastBackup||null}}}catch(e){}
  return {plan:{...DEFAULT_PLAN},logs:[]};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true}catch(e){storageOK=false}}
let state=load();

/* ---------- data queries ---------- */
const sessKey=s=>state.plan[pd(s).getDay()]||'R';
const sessFor=s=>SESS[sessKey(s)];
const logsOn=s=>state.logs.filter(l=>l.date===s);
const byDate=(a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.id<b.id?-1:1);
const logsOf=t=>state.logs.filter(l=>l.type===t).sort(byDate);
function isDone(s){const k=sessFor(s).kind,L=logsOn(s);if(k==='hvile')return false;return L.some(l=>l.type===(k==='styrke'?'styrke':'kondition'))}
function weekDates(s){const d=pd(s);const off=(d.getDay()+6)%7;return Array.from({length:7},(_,i)=>ds(new Date(d.getFullYear(),d.getMonth(),d.getDate()-off+i)))}
function lastSet(ex){
  if(!ex)return null;const L=logsOf('styrke');const k=ex.trim().toLowerCase();
  for(let i=L.length-1;i>=0;i--){const ss=L[i].sets.filter(s=>s.ex.toLowerCase()===k);if(ss.length){
    /* top weight; among those the hardest set (fewest reps + RIR) drives the next suggestion */
    const top=Math.max(...ss.map(s=>s.kg||0)),cand=ss.filter(s=>(s.kg||0)===top);
    const eff=s=>s.reps+(s.rir??s.tRir??2);
    const b=cand.reduce((a,c)=>eff(c)<eff(a)?c:a);
    const known=cand.filter(s=>s.rir!=null),avgRir=known.length?known.reduce((a,s)=>a+s.rir,0)/known.length:null;
    const avgReps=cand.reduce((a,s)=>a+s.reps,0)/cand.length;
    return {...b,avgReps,avgRir,saet:ss.reduce((n,s)=>n+(s.saet||1),0),date:L[i].date}}}
  return null;
}
/* All sets from the most recent session of an exercise, one entry per set */
function lastSets(ex){
  if(!ex)return [];const L=logsOf('styrke');const k=String(ex).trim().toLowerCase();
  for(let i=L.length-1;i>=0;i--){const ss=L[i].sets.filter(s=>s.ex.toLowerCase()===k);if(ss.length){
    const out=[];ss.forEach(s=>{for(let j=0;j<(s.saet||1);j++)out.push({kg:s.kg||0,reps:s.reps,rir:(j===(s.saet||1)-1)?s.rir:null})});return out}}
  return [];
}
/* Planned target for an exercise: reps and RIR */
function target(ex){const k=String(ex||'').trim().toLowerCase();for(const s of Object.values(SESS))for(const e of (s.ex||[]))if(e[0].toLowerCase()===k)return {reps:e[2],rir:e[3]};return null}
/* Next-session load. delta = (reps done + RIR) − (target reps + target RIR).
   On target → small step up. Each rep of difference ≈ 3,5 % (Epley: 1 rep ≈ 1/30 of 1RM). Capped at ±10 %. */
function suggest(ex){
  const l=lastSet(ex);if(!l)return null;
  const t=target(ex);
  const tr=l.tReps||(t?t.reps:l.reps), trir=(l.tRir??(t?t.rir:2));
  /* average over all sets at the top weight, so one grindy last set doesn't swing the load */
  const rir=l.avgRir!=null?l.avgRir:trir;
  const delta=Math.round((l.avgReps??l.reps)+rir-(tr+trir));
  if(!l.kg){
    if(delta>=3)return {kg:2.5,bw:true,text:'Tilføj 2,5 kg',l,rir,delta};
    if(delta>=0)return {kg:0,bw:true,text:'Prøv 1 rep mere',l,rir,delta};
    return {kg:0,bw:true,text:'Samme som sidst',l,rir,delta};
  }
  const step=/håndvægt|bulgarsk/i.test(ex)?2:2.5;
  let next;
  if(delta===0)next=l.kg+step;
  else{next=l.kg*Math.max(.9,Math.min(1.1,1+.035*delta));if(delta>0)next=Math.max(next,l.kg+step)}
  next=Math.max(step,Math.round(next/step)*step);
  return {kg:next,bw:false,text:fnum(next)+' kg',l,rir,delta};
}
const rirTxt=r=>(r===null||r===undefined||r==='')?'':` @ RIR ${r}`;
function loggedExercises(){const m=new Map();logsOf('styrke').forEach(l=>l.sets.forEach(s=>m.set(s.ex.toLowerCase(),s.ex)));return [...m.values()]}
function allExercises(){const set=new Set();Object.values(SESS).forEach(s=>(s.ex||[]).forEach(e=>set.add(e[0])));loggedExercises().forEach(e=>set.add(e));return [...set]}
const testNames=()=>[...new Set(logsOf('test').map(l=>l.name))];

/* ---------- UI state ---------- */
const now=new Date();
let ui={view:'today',calY:now.getFullYear(),calM:now.getMonth(),sel:TODAY,
  logType:'styrke',logDate:TODAY,sess:'A',rows:[],k:{sess:'I4',min:'',sek:'',dist:'',hr:'',rpe:'',note:''},
  v:{kg:''},t:{name:'',val:'',unit:'tid'},dirty:false,progEx:null,progTest:null,
  pendingDel:null,pendingRestore:false,pendingWipe:false,impText:''};

/* One row per exercise, one line per set. Prefill: kg = next-session suggestion (or last kg), reps + RIR = what you did in that set last time. */
function makeRow(ex,n,tReps,tRir){
  const prev=lastSets(ex),g=suggest(ex);n=Math.max(n||0,prev.length,1);
  const sets=Array.from({length:n},(_,i)=>{const p=prev[i]||prev[prev.length-1];
    const kg=g&&g.kg?g.kg:(p?p.kg:0);
    return {kg:kg?fnum(kg,2):'',reps:p?String(p.reps):(tReps?String(tReps):''),rir:p&&p.rir!=null?String(p.rir):'',done:false}});
  return {ex,tReps,tRir,sets};
}
function initRows(k){ui.rows=SESS[k].ex.map(([n,s,r,q])=>makeRow(n,s,r,q));saveDraft()}
const DKEY='styrke-vo2-draft.v1';
function saveDraft(){try{if(ui.logType==='styrke'&&ui.rows.some(r=>r.sets.some(s=>s.done)))localStorage.setItem(DKEY,JSON.stringify({date:ui.logDate,sess:ui.sess,rows:ui.rows}));else localStorage.removeItem(DKEY)}catch(e){}}
function loadDraft(){try{const d=JSON.parse(localStorage.getItem(DKEY)||'null');if(d&&d.date===TODAY&&Array.isArray(d.rows))return d}catch(e){}return null}
function clearDraft(){try{localStorage.removeItem(DKEY)}catch(e){}}
function initStyrke(date){
  const d=loadDraft();if(d&&d.date===date){ui.sess=d.sess;ui.rows=d.rows;return}
  const key=sessKey(date);ui.sess=['A','B','C'].includes(key)?key:(['A','B','C'].includes(ui.sess)?ui.sess:'A');initRows(ui.sess)}
function openLog(date){
  ui.logDate=date;const key=sessKey(date),k=SESS[key].kind;
  if(k==='styrke')ui.logType='styrke';else if(k==='interval'||k==='zone2'){ui.logType='kondition';ui.k.sess=key}
  initStyrke(date);ui.dirty=false;ui.view='log';render(true);
}

/* ---------- views ---------- */
function sessionBody(s){
  if(s.ex)return `<ul class="ex">${s.ex.map(([n,a,b,q])=>{const g=suggest(n);
    const line=g?`<span class="sug num">Forslag: ${esc(g.text)}</span><span class="exl num">Sidst ${g.l.kg?fnum(g.l.kg)+' kg':'kropsvægt'} × ${g.l.reps}${rirTxt(g.l.rir)} (${shortDate(g.l.date)})</span>`
      :`<span class="exl">Første gang: vælg en vægt hvor du har ${q} reps tilbage i sidste sæt.</span>`;
    return `<li><span class="exn">${esc(n)}</span><span class="exp num">${a}×${b}<small>RIR ${q}</small></span>${line}</li>`}).join('')}</ul>`;
  return `<ol class="steps">${s.steps.map(t=>`<li>${esc(t)}</li>`).join('')}</ol>${s.kind==='interval'||s.kind==='zone2'?kondTip(s):''}`;
}
function kondTip(s){
  const L=logsOf('kondition').filter(l=>l.name===s.name),l=L[L.length-1];if(!l)return '';
  const b=[fmtTime(l.dur)];if(l.dist)b.push(fnum(l.dist,2)+' km');if(l.hr)b.push(Math.round(l.hr)+' bpm');if(l.rpe)b.push('RPE '+l.rpe);
  let tip;
  if(!l.rpe)tip='Log RPE næste gang, så kan appen hjælpe med intensiteten.';
  else if(s.kind==='zone2')tip=l.rpe>=7?'Det var for hårdt til zone 2. Sænk tempoet i dag.':'God intensitet. Hold det roligt igen.';
  else tip=l.rpe<=8?'Lidt for let (målet er RPE 9). Gå hårdere i intervallerne i dag.':l.rpe>=10?'Det var helt maks. Hold samme tempo i dag.':'Rigtig intensitet. Prøv at komme lidt længere eller op i watt i dag.';
  return `<p class="sug num">Sidst (${shortDate(l.date)}): ${b.join(' · ')}</p><p class="hint">${tip}</p>`;
}
function nextSession(from){const d=pd(from);for(let i=1;i<=7;i++){const n=ds(new Date(d.getFullYear(),d.getMonth(),d.getDate()+i)),s=sessFor(n);if(s.kind!=='hvile')return {d:n,s,i}}return null}
const daysSince=d=>Math.round((pd(TODAY)-pd(d))/864e5);
function weekCell(d){
  const s=sessFor(d),dt=pd(d);
  return `<button class="wd k-${s.kind}${d===TODAY?' is-today':''}${isDone(d)?' is-done':''}" data-act="calday" data-date="${d}" aria-label="${niceDate(d)}: ${s.name}">
    <span class="dl">${DAYS[dt.getDay()].slice(0,2)}</span><span class="dn num">${dt.getDate()}</span><span class="bar"></span></button>`;
}
function viewToday(){
  const s=sessFor(TODAY),done=isDone(TODAY),wk=weekDates(TODAY);
  const planned=wk.filter(d=>sessFor(d).kind!=='hvile'),doneN=planned.filter(isDone).length;
  const W=logsOf('vaegt'),w=W[W.length-1],key=sessKey(TODAY);
  let actions;
  if(s.kind==='styrke')actions=`<button class="btn accent" data-act="logday" data-date="${TODAY}">${loadDraft()?'Fortsæt træning':done?'Log mere':'Start træning'}</button>`;
  else if(s.kind==='hvile'){const n=nextSession(TODAY);actions=(n?`<p class="note">Næste pas: <b>${esc(n.s.name)}</b> ${n.i===1?'i morgen':'på '+DAYS[pd(n.d).getDay()]}.</p>`:'')}
  else actions=`<div class="btns"><button class="btn accent" data-act="timer" data-key="${key}">${s.kind==='zone2'?'Start timer':'Start intervaltimer'}</button><button class="btn ghost" data-act="logday" data-date="${TODAY}">Log uden timer</button></div>`;
  const T=logsOf('test'),lastT=T.length?T[T.length-1].date:null,testDue=!lastT||daysSince(lastT)>=42;
  const backupDue=state.logs.length>=5&&(!state.lastBackup||daysSince(state.lastBackup)>=14);
  const B=bestLift();
  const wDelta=W.length>1?W[W.length-1].kg-W[0].kg:null;
  return `<section class="card">
    <div class="row-between">${chip(s.kind,KIND_LABEL[s.kind])}${s.dur?`<span class="muted small">${s.dur}</span>`:''}</div>
    <h2 class="sess">${esc(s.name)}</h2>
    ${sessionBody(s)}
    ${s.note?`<p class="note">${esc(s.note)}</p>`:''}
    ${done?'<p class="done-msg">✓ Logget i dag</p>':''}
    ${actions}
  </section>
  ${testDue?`<section class="banner"><span class="bi">!</span><div><b>${lastT?'Tid til en ny test':'Lav en baseline-test'}</b>
    <p>En 3 km løbetest eller Cooper-test hver 6. uge viser, om din VO₂max går frem. Tag den udhvilet.</p>
    <button data-act="logtest">Log test</button></div></section>`:''}
  <section class="card">
    <div class="row-between"><h3 class="sec">Denne uge</h3><span class="muted small num">${doneN} af ${planned.length} pas</span></div>
    ${dial(doneN,planned.length)}
    <div class="week">${wk.map(weekCell).join('')}</div>
  </section>
  <section class="stats">
    <div class="stat"><span class="lab">Kropsvægt</span><b class="num">${w?fnum(w.kg)+'<small>kg</small>':'–'}</b><em class="num">${wDelta!=null?`${wDelta>0?'+':wDelta<0?'−':'±'}${fnum(Math.abs(wDelta))} kg siden ${shortDate(W[0].date)}`:w?'Første måling':'Log under Vægt'}</em></div>
    <div class="stat"><span class="lab">${B?esc(B.ex)+' · est. 1RM':'Styrke'}</span><b class="num">${B?fnum(B.v,0)+'<small>kg</small>':'–'}</b><em class="num">${B?`Sidst ${shortDate(B.date)}`:'Log et styrkepas'}</em></div>
  </section>
  ${backupDue?`<section class="card"><p class="rt">Tag en backup</p><p class="hint">Dine logs ligger kun på denne telefon. Kopiér backuppen og gem den fx i Noter.</p>
    <button class="btn ghost" data-act="copy">Kopiér backup</button><textarea id="exp" readonly rows="3" hidden aria-label="Backup-tekst"></textarea></section>`:''}`;
}
function bestLift(){
  const ex=loggedExercises();if(!ex.length)return null;
  const pick=ex.find(e=>e.toLowerCase()==='squat')||ex.find(e=>e.toLowerCase()==='dødløft')||ex[0];const k=pick.toLowerCase();
  const L=logsOf('styrke');for(let i=L.length-1;i>=0;i--){const ss=L[i].sets.filter(s=>s.ex.toLowerCase()===k&&s.kg>0);if(ss.length)return {ex:pick,v:Math.max(...ss.map(s=>e1rm(s.kg,s.reps+(s.rir||0)))),date:L[i].date}}
  return null;
}
/* Segmented half-dial: one rounded block per planned session this week, filled when done */
function dial(done,total){
  total=Math.max(total,1);const cx=150,cy=150,r=112,span=180/total,arc=r*span*Math.PI/180,h=Math.max(10,arc-8);
  let g='';for(let i=0;i<total;i++){const th=180+span*(i+.5),rad=th*Math.PI/180,x=cx+r*Math.cos(rad),y=cy+r*Math.sin(rad);
    g+=`<rect class="${i<done?'seg-on':'seg-off'}" x="-19" y="${(-h/2).toFixed(1)}" width="38" height="${h.toFixed(1)}" rx="11" transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${th.toFixed(1)})"/>`}
  return `<div class="dial" role="img" aria-label="${done} af ${total} pas gennemført denne uge"><svg viewBox="0 0 300 170">${g}</svg>
    <div class="dial-c"><span class="ic">⚡</span><b class="num">${done}/${total}</b><span>pas gennemført</span></div></div>`;
}
function viewCal(){
  const y=ui.calY,m=ui.calM,first=new Date(y,m,1),start=(first.getDay()+6)%7,n=new Date(y,m+1,0).getDate();
  let cells='';for(let i=0;i<start;i++)cells+='<span class="cd empty"></span>';
  for(let d=1;d<=n;d++){const s=ds(new Date(y,m,d)),se=sessFor(s),done=logsOn(s).length>0;
    cells+=`<button class="cd k-${se.kind}${s===TODAY?' is-today':''}${s===ui.sel?' is-sel':''}${done?' is-done':''}${s<TODAY?' past':''}" data-act="sel" data-date="${s}" aria-label="${niceDate(s)}: ${se.name}"><span class="dn num">${d}</span><span class="bar"></span></button>`}
  const sel=ui.sel,se=sessFor(sel),L=logsOn(sel).sort(byDate);
  return `<div class="cal-head"><button class="icon-btn" data-act="mprev" aria-label="Forrige måned">‹</button><h2 class="month">${MONTHS[m]} ${y}</h2><button class="icon-btn" data-act="mnext" aria-label="Næste måned">›</button></div>
  <div class="card cal-card"><div class="cal-grid">${['Ma','Ti','On','To','Fr','Lø','Sø'].map(x=>`<span class="cw">${x}</span>`).join('')}${cells}</div></div>
  <div class="legend">${['styrke','interval','zone2','hvile'].map(k=>chip(k,KIND_LABEL[k])).join('')}</div>
  <p class="hint">Tom ring = planlagt · udfyldt ring = gennemført</p>
  <section class="card">
    <p class="eyebrow">${cap(niceDate(sel))}${sel===TODAY?' · i dag':''}</p>
    <div class="row-between"><h2 class="sess">${esc(se.name)}</h2>${chip(se.kind,KIND_LABEL[se.kind])}</div>
    ${sessionBody(se)}
    ${L.length?`<h3 class="sec">Logget</h3><div>${L.map(logItem).join('')}</div>`:''}
    <button class="btn primary" data-act="logday" data-date="${sel}">Log denne dag</button>
  </section>`;
}
function logItem(l){
  const map={styrke:['styrke','Styrke'],kondition:['interval','Kondition'],vaegt:['vaegt','Vægt'],test:['test','Test']};
  const [k,lab]=map[l.type]||['hvile','Log'];let title='',detail='';
  if(l.type==='styrke'){title=esc(l.sess||'Styrke');
    const g=new Map();l.sets.forEach(s=>{const k=s.ex;if(!g.has(k))g.set(k,[]);g.get(k).push(s)});
    detail=[...g].map(([ex,ss])=>`${esc(ex)}: ${ss.map(s=>`${(s.saet||1)>1?s.saet+'×':''}${s.kg?fnum(s.kg,2):'kv'}×${s.reps}${s.rir!=null?'@'+s.rir:''}`).join(', ')}`).join('<br>')}

function chart(pts,fmt,kind){

/* ---------- sound ---------- */
let actx;
function beep(freq=880,dur=.15,vol=.3){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
    const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;o.type='square';o.frequency.value=freq;o.connect(g);g.connect(actx.destination);
    g.gain.setValueAtTime(vol*.4,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.start(t);o.stop(t+dur+.02)}catch(e){}
}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

/* ---------- interval timer ---------- */
function buildPhases(key){
  const P=[],add=(label,sec,type)=>P.push({label,sec,type});
  if(key==='I4'){add('Opvarmning',600,'easy');for(let i=1;i<=4;i++){add(`Interval ${i} af 4 · hårdt`,240,'work');if(i<4)add('Aktiv pause',180,'rest')}add('Nedvarmning',300,'easy')}
  else if(key==='I30'){add('Opvarmning',600,'easy');for(let s=1;s<=3;s++){for(let r=1;r<=10;r++){add(`Serie ${s} · ${r}/10 · hårdt`,30,'work');if(r<10)add(`Serie ${s} · ${r}/10 · let`,15,'rest')}if(s<3)add('Seriepause',180,'rest')}add('Nedvarmning',300,'easy')}
  else add('Zone 2 · roligt tempo',2700,'easy');

}
let timer=null,loop=null,wake=null,lastBeep=-1;

function phaseSignal(type){if(type==='work'){beep(1046,.18);setTimeout(()=>beep(1046,.18),260);buzz([200,100,200])}else{beep(523,.45);buzz(400)}}
function startTimer(key){

  timer.end=Date.now()+timer.phases[0].sec*1000;lastBeep=-1;ui.view='timer';keepAwake();ensureLoop();render(true);
}
function advance(skip){

  if(!completed&&T.idx<T.phases.length)tot+=T.phases[T.idx].sec-remain();tot=Math.round(tot);

  ui.k={...ui.k,sess:T.key,min:String(Math.floor(tot/60)),sek:String(tot%60),dist:'',hr:'',rpe:'',note:''};
  ui.logType='kondition';ui.logDate=TODAY;ui.dirty=true;ui.view='log';render(true);

function tick(){

  }
  if(timer&&ui.view==='timer'){const t=$('#tm-time'),p=$('#tm-prog'),ph=timer.phases[timer.idx];
    if(t)t.textContent=fmtTime(Math.ceil(remain()));if(p){const C=2*Math.PI*88;p.setAttribute('stroke-dashoffset',(C*remain()/ph.sec).toFixed(1))}}

    if(left<=0&&!ui.rest.done){ui.rest.done=true;beep(988,.2);setTimeout(()=>beep(988,.2),300);buzz([300,150,300])}
    if(el)el.textContent=left>0?`Pause ${fmtTime(left)}`:'Næste sæt!';
    if(left<=-10){ui.rest=null;$('#restbar').hidden=true}}
  if(!timer&&!ui.rest){clearInterval(loop);loop=null}
}
function viewTimer(){
  const T=timer;if(!T){ui.view='today';return viewToday()}
  const ph=T.phases[T.idx],nx=T.phases[T.idx+1],s=SESS[T.key];
  const C=2*Math.PI*88,frac=1-remain()/ph.sec,PH={work:'Hårdt',rest:'Pause',easy:'Roligt'};
  return `<section class="timer ph-${ph.type}">
    <p class="eyebrow">${esc(s.name)} · fase ${T.idx+1} af ${T.phases.length}</p>
    <p class="tm-label">${esc(ph.label)}</p>
    <div class="tm-ring"><svg viewBox="0 0 200 200" aria-hidden="true"><circle class="trk" cx="100" cy="100" r="88" fill="none" stroke-width="12"/>
      <circle class="prg" id="tm-prog" cx="100" cy="100" r="88" fill="none" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-frac)).toFixed(1)}"/></svg>
      <div class="in"><p class="tm-time num" id="tm-time" aria-live="off">${fmtTime(Math.ceil(remain()))}</p><span class="tm-ph">${T.paused?'På pause':PH[ph.type]}</span></div></div>
    <p class="tm-next">${nx?`Næste: ${esc(nx.label)} · ${fmtTime(nx.sec)}`:'Sidste fase'}</p>
  </section>
  <div class="btns3"><button class="btn ${T.paused?'accent':'primary'}" data-act="tpause">${T.paused?'Fortsæt':'Pause'}</button><button class="btn ghost" data-act="tskip">Spring over</button><button class="btn danger${T.stopArmed?' armed':''}" data-act="tstop">${T.stopArmed?'Bekræft':'Stop'}</button></div>
  <p class="hint">${ph.type==='work'?'Hårdt: 90–95 % af maks puls, RPE 9. Det skal føles svært de sidste minutter.':ph.type==='rest'?'Aktiv pause: jog eller træd let. Hold dig i gang.':'Roligt tempo. Du skal kunne tale i hele sætninger.'}</p>
  <p class="hint">Appen bipper 3-2-1 og ved hvert skift. Hold appen åben på skærmen.</p>`;
}

/* ---------- render ---------- */
function render(top){
  const v=ui.view;
  $('#main').innerHTML=(storageOK?'':'<p class="warn">Browseren tillader ikke at gemme her. Åbn siden i Chrome og tilføj den til startskærmen, ellers forsvinder dine logs.</p>')+
    (timer&&v!=='timer'?'<button class="btn primary" data-act="view" data-view="timer">Timeren kører · gå tilbage</button>':'')+
    (v==='today'?viewToday():v==='cal'?viewCal():v==='log'?viewLog():v==='prog'?viewProg():v==='timer'?viewTimer():viewSettings());
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.view===v));
  {const st=sessFor(TODAY);$('#hdr-hi').textContent='Hej Mikkel! · '+cap(niceDate(TODAY));$('#hdr-date').textContent=v==='today'?(st.kind==='hvile'?'Hviledag i dag. Restitution er også træning.':`Klar til ${st.name}?`):v==='timer'?'Hold fokus':'Styrke & VO₂ log'}
  if(top)window.scrollTo(0,0);
}
let tt;function toast(msg){const el=$('#toast');el.textContent=msg;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{el.hidden=true},2200)}

/* ---------- actions ---------- */
function doSave(){
  const date=ui.logDate||TODAY,id=Date.now().toString(36)+Math.random().toString(36).slice(2,6),t=ui.logType;let entry;
  if(t==='styrke'){
    const anyDone=ui.rows.some(r=>r.sets.some(s=>s.done));
    const sets=[];ui.rows.forEach(r=>{const ex=String(r.ex).trim();if(!ex)return;const t=target(ex);
      r.sets.forEach(s=>{if(anyDone&&!s.done)return;const reps=parseInt(s.reps)||0,q=parseInt(s.rir);if(reps<=0)return;
        sets.push({ex,kg:num(s.kg)??0,saet:1,reps,rir:isFinite(q)?q:null,tReps:r.tReps??(t?t.reps:null),tRir:r.tRir??(t?t.rir:null)})})});
    if(!sets.length)return toast('Udfyld mindst ét sæt med reps');
    entry={id,date,type:'styrke',sess:ui.sess==='X'?'Styrke':SESS[ui.sess].name,sets};
  }else if(t==='kondition'){
    const dur=(num(ui.k.min)||0)*60+(num(ui.k.sek)||0);if(!dur)return toast('Skriv hvor lang tid du trænede');
    entry={id,date,type:'kondition',name:ui.k.sess==='X'?'Kondition':SESS[ui.k.sess].name,dur,dist:num(ui.k.dist),hr:num(ui.k.hr),rpe:num(ui.k.rpe),note:ui.k.note.trim()};
  }else if(t==='vaegt'){
    const kg=num(ui.v.kg);if(!kg)return toast('Skriv din vægt i kg');entry={id,date,type:'vaegt',kg};
  }else{
    const name=ui.t.name.trim();if(!name)return toast('Skriv hvilken test det er');
    const value=ui.t.unit==='tid'?parseTime(ui.t.val):num(ui.t.val);if(value===null||!value)return toast(ui.t.unit==='tid'?'Skriv tiden som mm:ss, fx 12:30':'Skriv et tal');
    entry={id,date,type:'test',name,value,unit:ui.t.unit};
  }
  state.logs.push(entry);save();
  if(t==='styrke'){clearDraft();ui.rest=null;$('#restbar').hidden=true;initRows(ui.sess==='X'?'A':ui.sess)}
  ui.k={...ui.k,min:'',sek:'',dist:'',hr:'',rpe:'',note:''};ui.v.kg='';ui.t.val='';ui.dirty=false;
  if(!storageOK){render();return toast('Kunne ikke gemme på telefonen')}
  if((t==='styrke'||t==='kondition')&&date===TODAY){ui.view='today';render(true);toast(t==='styrke'?'Gemt. Næste gangs vægte er klar.':'Gemt')}
  else{render();toast('Gemt')}
}
function doCopy(){
  const txt=JSON.stringify(state),ta=$('#exp');
  const mark=()=>{state.lastBackup=TODAY;save()};
  const fallback=()=>{mark();ta.hidden=false;ta.value=txt;ta.focus();ta.select();toast('Markér og kopiér teksten')};
  try{navigator.clipboard.writeText(txt).then(()=>{mark();render();toast('Backup kopieret')},fallback)}catch(e){fallback()}
}
function doRestore(){
  let d;try{d=JSON.parse(ui.impText)}catch(e){d=null}
  if(!d||!Array.isArray(d.logs)){ui.pendingRestore=false;render();return toast('Teksten er ikke en gyldig backup')}
  if(!ui.pendingRestore){ui.pendingRestore=true;return render()}
  state={plan:{...DEFAULT_PLAN,...(d.plan||{})},logs:d.logs,lastBackup:d.lastBackup||null};save();ui.pendingRestore=false;ui.impText='';render();toast(`Gendannet ${d.logs.length} logs`);
}
function guessUnit(name){
  const prev=logsOf('test').filter(l=>l.name===name);if(prev.length)return prev[prev.length-1].unit;
  const n=name.toLowerCase();
  if(n.includes('1rm'))return 'kg';if(n.includes('cooper'))return 'm';if(n.includes('pull')||n.includes('reps'))return 'reps';if(n.includes('vo₂')||n.includes('vo2'))return 'ml/kg/min';
  return 'tid';
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a!=='del')ui.pendingDel=null;if(a!=='wipe')ui.pendingWipe=false;if(a!=='restore')ui.pendingRestore=false;if(a!=='tstop'&&timer)timer.stopArmed=false;
  switch(a){
    case 'timer':startTimer(b.dataset.key);break;
    case 'tpause':if(timer.paused){timer.end=Date.now()+timer.left;timer.paused=false;keepAwake()}else{timer.left=timer.end-Date.now();timer.paused=true}render();break;
    case 'tskip':advance(true);break;
    case 'tstop':if(timer.stopArmed)finishTimer(false);else{timer.stopArmed=true;render()}break;
    case 'rest':beep(660,.04,.05);ui.rest={end:Date.now()+(+b.dataset.sec)*1000,done:false};$('#restbar').hidden=false;ensureLoop();tick();break;
    case 'reststop':ui.rest=null;$('#restbar').hidden=true;break;
    case 'setdone':{const r=ui.rows[+b.dataset.i],s=r.sets[+b.dataset.j];
      if(!s.done&&!(parseInt(s.reps)>0)){toast('Skriv reps først');break}
      s.done=!s.done;ui.dirty=true;saveDraft();
      if(s.done){beep(660,.04,.05);buzz(30);ui.rest={end:Date.now()+restSec(r.ex)*1000,done:false};$('#restbar').hidden=false;ensureLoop();tick()}
      render();break}
    case 'addset':{const r=ui.rows[+b.dataset.i],l=r.sets[r.sets.length-1]||{kg:'',reps:r.tReps?String(r.tReps):'',rir:''};r.sets.push({kg:l.kg,reps:l.reps,rir:'',done:false});ui.dirty=true;saveDraft();render();break}
    case 'rmset':{const r=ui.rows[+b.dataset.i];if(r.sets.length>1)r.sets.pop();ui.dirty=true;saveDraft();render();break}
    case 'logtest':ui.logType='test';ui.logDate=TODAY;ui.view='log';render(true);break;
    case 'view':ui.view=b.dataset.view;if(ui.view==='log'&&!ui.dirty){openLog(TODAY);return}render(true);break;
    case 'settings':ui.view='settings';render(true);break;
    case 'logday':openLog(b.dataset.date);break;
    case 'calday':{ui.sel=b.dataset.date;const d=pd(ui.sel);ui.calY=d.getFullYear();ui.calM=d.getMonth();ui.view='cal';render(true);break}
    case 'sel':ui.sel=b.dataset.date;render();break;
    case 'mprev':if(--ui.calM<0){ui.calM=11;ui.calY--}render();break;
    case 'mnext':if(++ui.calM>11){ui.calM=0;ui.calY++}render();break;
    case 'ltype':ui.logType=b.dataset.type;if(ui.logType==='styrke'&&!ui.rows.length)initStyrke(ui.logDate);render();break;
    case 'addrow':ui.rows.push(makeRow('',3,8,2));ui.dirty=true;render();{const el=$('#r'+(ui.rows.length-1)+'-ex');if(el)el.focus()}break;
    case 'rmrow':ui.rows.splice(+b.dataset.i,1);ui.dirty=true;saveDraft();render();break;
    case 'save':doSave();break;
    case 'del':if(ui.pendingDel===b.dataset.id){state.logs=state.logs.filter(l=>l.id!==b.dataset.id);save();ui.pendingDel=null;toast('Slettet')}else ui.pendingDel=b.dataset.id;render();break;
    case 'resetplan':state.plan={...DEFAULT_PLAN};save();render();toast('Standardplan gendannet');break;
    case 'copy':doCopy();break;
    case 'restore':doRestore();break;
    case 'wipe':if(ui.pendingWipe){state.logs=[];save();ui.pendingWipe=false;toast('Alle logs slettet')}else ui.pendingWipe=true;render();break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.row!==undefined){const r=ui.rows[+t.dataset.row];if(r){r[t.dataset.f]=t.value;ui.dirty=true}return}
  if(t.dataset.set!==undefined){const [i,j]=t.dataset.set.split('.').map(Number),r=ui.rows[i];if(!r)return;const s=r.sets[j],f=t.dataset.f,old=s[f];s[f]=t.value;ui.dirty=true;
    /* changing kg or reps carries forward to later sets that aren't done and still had the old value */
    if(f!=='rir')for(let k=j+1;k<r.sets.length;k++){const n=r.sets[k];if(!n.done&&n[f]===old){n[f]=t.value;const el=$(`#s${i}-${k}-${f}`);if(el)el.value=t.value}}
    saveDraft();return}
  if(t.dataset.bind){const [o,k]=t.dataset.bind.split('.');if(k)ui[o][k]=t.value;else ui[o]=t.value;if(o!=='impText')ui.dirty=true}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='f-date'){ui.logDate=t.value||TODAY;const key=sessKey(ui.logDate);
    if(ui.logType==='styrke'&&['A','B','C'].includes(key)&&key!==ui.sess){ui.sess=key;initRows(key)}
    if(ui.logType==='kondition'&&['I4','I30','Z2'].includes(key))ui.k.sess=key;render()}
  else if(t.id==='f-sess'){ui.sess=t.value;if(t.value!=='X')initRows(t.value);else ui.rows=[makeRow('',3,8,2)];render()}
  else if(t.dataset.row!==undefined&&t.dataset.f==='ex'){const i=+t.dataset.row,r=ui.rows[i];
    if(r&&!r.sets.some(s=>s.done)){const tg=target(t.value);ui.rows[i]=makeRow(t.value.trim(),r.sets.length,tg?tg.reps:r.tReps,tg?tg.rir:r.tRir);render()}}
  else if(t.dataset.plan!==undefined){state.plan[t.dataset.plan]=t.value;save();toast('Ugeplan opdateret')}
  else if(t.id==='p-ex'){ui.progEx=t.value;render()}
  else if(t.id==='p-test'){ui.progTest=t.value;render()}
  else if(t.id==='t-unit'){ui.t.unit=t.value;render()}
  else if(t.id==='t-name'){ui.t.name=t.value;if(t.value.trim())ui.t.unit=guessUnit(t.value.trim());render()}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(timer&&!timer.paused)keepAwake();const n=ds(new Date());if(n!==TODAY){TODAY=n;render()}}});

render();
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}</script>
