<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ECEDEF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1012" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0;font-size:14px}img{max-width:100%}</style>
<title>Styrke & VO₂ Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: soft grey canvas, white rounded cards with soft shadows, thin oversized numerals, orange accent, floating dark pill nav. */
:root{
  --bg:#ECEDEF; --surface:#FFFFFF; --surface-2:#F3F3F5; --fg:#17181B; --muted:#7D8089; --line:#E3E4E8;
  --accent:#F26A1B; --accent-2:#FF9A4D; --pill:#17181B; --pill-fg:#FFFFFF; --nav:#1C1D21; --nav-fg:#9C9EA6; --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgb(20 20 30 / .04),0 8px 24px rgb(20 20 30 / .06);
  --k-styrke:#2F6FEB; --k-interval:#F26A1B; --k-zone2:#14A37A; --k-hvile:#B3B5BC; --k-test:#E3B11B; --k-vaegt:#8B5CF6; --k-mobilitet:#D9468F; --k-kulde:#139FC4; --k-meditation:#8B63E8; --k-tak:#D98E12; --k-crossfit:#E5484D;
  --font:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:var(--font); --body:var(--font);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1012; --surface:#1B1C20; --surface-2:#25262B; --fg:#F2F2F4; --muted:#8E909A; --line:#2E3036;
  --accent:#FF7A2E; --accent-2:#FFA766; --pill:#F2F2F4; --pill-fg:#111214; --nav:#000000; --nav-fg:#8E909A; --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 8px 24px rgb(0 0 0 / .25);
  --k-styrke:#5B93FF; --k-interval:#FF8A3D; --k-zone2:#2FD3A0; --k-hvile:#6B6E77; --k-test:#F5CB45; --k-vaegt:#B394FF; --k-mobilitet:#FF79B8; --k-kulde:#4FD3F2; --k-meditation:#B59AFF; --k-tak:#FFC15A; --k-crossfit:#FF6369;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1012; --surface:#1B1C20; --surface-2:#25262B; --fg:#F2F2F4; --muted:#8E909A; --line:#2E3036;
  --accent:#FF7A2E; --accent-2:#FFA766; --pill:#F2F2F4; --pill-fg:#111214; --nav:#000000; --nav-fg:#8E909A; --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 8px 24px rgb(0 0 0 / .25);
  --k-styrke:#5B93FF; --k-interval:#FF8A3D; --k-zone2:#2FD3A0; --k-hvile:#6B6E77; --k-test:#F5CB45; --k-vaegt:#B394FF; --k-mobilitet:#FF79B8; --k-kulde:#4FD3F2; --k-meditation:#B59AFF; --k-tak:#FFC15A; --k-crossfit:#FF6369;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:18px calc(170px + env(safe-area-inset-bottom,0px))}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.no-top header.top{display:none}
.gear-fixed{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 14px);right:max(16px,calc((100vw - 520px)/2 + 16px));box-shadow:var(--shadow)}
.has-gear .wrap{padding-top:calc(env(safe-area-inset-top,0px) + 72px)}

.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.sw{appearance:none;border:0;background:none;color:var(--muted);display:grid;justify-items:center;gap:6px;font:500 11px/1 var(--font);cursor:pointer;padding:0}
.sw i{width:36px;height:36px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--surface),0 0 0 3px transparent;transition:box-shadow .15s}
.sw.on i{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--c)}
.sw.on{color:var(--fg)}
.pl-goal{margin:2px 0 0;font-size:20px;font-weight:600}
.pl-meter{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin:6px 0 4px}
.pl-meter i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.mw{gap:0}
.m-r.today .pl-d{color:var(--accent);font-weight:600}
.m-r .ok{color:var(--k-zone2)}
.m-r{grid-template-columns:52px auto 1fr auto}

.gl{display:grid;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.gl:first-of-type{border-top:0}
.gl-nums{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gl-nums .num{font-size:24px;font-weight:600}
.gl .meter{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.gl .meter i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--k-zone2))}
.gl .ok{color:var(--k-zone2);margin:0}
.gl-x{appearance:none;border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 4px}
.goal-form{display:grid;gap:10px;padding-top:8px}
.k-list{display:grid;gap:2px;margin-top:6px}
.k-row{display:grid;gap:2px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}

.pl-week-edit{padding:6px 10px;gap:0}
.pl-wrow{appearance:none;border:0;background:none;color:var(--fg);display:grid;grid-template-columns:44px 40px 1fr auto auto;align-items:center;gap:10px;padding:10px 6px;border-top:1px solid var(--line);font:500 16px/1.2 var(--font);text-align:left;cursor:pointer;width:100%}
.pl-wrow:first-child{border-top:0}
.pl-wd{color:var(--muted);font-size:14px}
.pl-wrow .chev{color:var(--muted);font-size:20px}
.pl-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--k) 18%,transparent);color:var(--k)}
.pl-ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pl-warn{width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font:700 12px/20px var(--font);text-align:center}
.pl-sum{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-size:13px;color:var(--muted)}
.pl-sum>span{display:inline-flex;align-items:center;gap:6px}
.sheet-bg{position:fixed;inset:0;z-index:20;background:rgb(0 0 0 / .5);display:flex;align-items:flex-end;justify-content:center;animation:wdin .15s ease-out}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.sheet-t{margin:0;text-align:center;font-weight:600}
.sheet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sheet-b{appearance:none;border:2px solid transparent;background:var(--surface-2);color:var(--fg);border-radius:16px;padding:14px 4px;display:grid;justify-items:center;gap:8px;font:500 13px/1.2 var(--font);cursor:pointer}
.sheet-b.on{border-color:var(--k)}
.sheet-b .pl-ic{width:44px;height:44px;border-radius:14px}
.ob-n{grid-template-columns:repeat(5,1fr)}
.ob-add{font-size:13px;color:var(--muted);font-weight:400}
.stepper{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:8px}
.stepper button{appearance:none;border:0;height:48px;border-radius:14px;background:var(--surface-2);color:var(--fg);font:500 22px/1 var(--font);cursor:pointer}
.stepper b{text-align:center;font-size:22px;font-weight:600}
.warn-t{color:var(--accent)}
.pl-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.pl-day{appearance:none;border:0;border-radius:14px;padding:14px 0;background:var(--surface-2);color:var(--fg);font:600 14px/1 var(--font);cursor:pointer}
.pl-day.on{background:var(--pill);color:var(--pill-fg)}
.pl-row{display:grid;grid-template-columns:40px 1fr;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.pl-row:first-child{border-top:0}
.pl-row .chips{gap:6px}
.pl-det{padding:4px 0 14px;display:grid;gap:6px;font-size:14px;animation:wdin .18s ease-out}
.pl-det p{margin:0}
.pl-r .chev{color:var(--muted)}
button.pl-r{appearance:none;border:0;border-top:1px solid var(--line);background:none;color:var(--fg);width:100%;text-align:left;font:inherit;font-size:14px;cursor:pointer}
.pl-r{display:grid;grid-template-columns:34px auto 1fr auto;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.pl-r.past{opacity:.45}
.pl-d{color:var(--muted);font-size:13px}
.pl-l{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag-dl{font-size:12px;font-weight:600;color:var(--accent)}

.fw-sec{gap:8px}
.fw-h{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;margin-bottom:4px}
.fw-h h3{margin:0;font-size:18px;font-weight:600}
.fw-l{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--pill);color:var(--pill-fg);font-weight:700;font-size:14px}
.fw-roll{width:40px;height:40px;font-size:17px}
.fw-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;font-size:15px;line-height:1.35;padding:2px 0}
.fw-sw{appearance:none;border:0;background:var(--surface-2);color:var(--muted);width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:15px}
.fw-sub{margin:6px 0 0;font-size:13px;color:var(--muted)}
.fw-lift{font-size:20px;font-weight:600}
.fw-lines p{margin:4px 0;font-size:15px;font-weight:500}
.hint.center{text-align:center}

.wd.is-sel:not(.is-today){box-shadow:inset 0 0 0 1.5px var(--muted)}
.wd.is-sel.is-today{box-shadow:0 0 0 2px var(--accent)}
.wdet{margin-top:6px;padding:14px;border-radius:16px;background:var(--surface-2);display:grid;gap:6px;animation:wdin .18s ease-out}
@keyframes wdin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.wdet-n{margin:2px 0 0;font-size:19px;font-weight:600}
.wdet p{margin:0}
.wdet .ok{color:var(--k-zone2)}
.wdet-l{margin:2px 0 4px;padding-left:18px;font-size:14px;line-height:1.5;color:var(--fg)}

.today-date{font-size:15px}
.slim-note{margin:0;font-size:13px;color:var(--muted);text-align:center}
.linkbtn{appearance:none;border:0;background:none;color:var(--muted);font:500 14px/1.3 var(--font);padding:6px;cursor:pointer;text-align:center}
.empty.center{text-align:center}
.cal-head .icon-btn[data-act=settings]{margin-left:4px}

.no-top .wrap{min-height:100%;box-sizing:border-box;padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.no-top #main{flex:1;justify-content:center}
.tr-top{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.tr-top .btn{margin:0}
.brand{font-weight:400;font-size:16px;color:var(--muted);margin:0}
.hdate{font-weight:500;font-size:24px;line-height:1.15;margin:2px 0 0;text-wrap:balance;letter-spacing:-.01em}
.top-actions{display:flex;gap:8px}
#main{display:flex;flex-direction:column;gap:16px}
section{display:flex;flex-direction:column;gap:12px}

.card{background:var(--surface);border:0;border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.sess{font-weight:500;font-size:28px;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.015em}
.h2{font-weight:500;font-size:28px;margin:0;letter-spacing:-.015em}
.sec{font-weight:500;font-size:15px;color:var(--fg);margin:0}
.eyebrow{margin:0;font-size:13px;font-weight:400;color:var(--muted)}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px}

.k-styrke{--k:var(--k-styrke)} .k-interval{--k:var(--k-interval)} .k-zone2{--k:var(--k-zone2)}
.k-hvile{--k:var(--k-hvile)} .k-test{--k:var(--k-test)} .k-vaegt{--k:var(--k-vaegt)} .k-mobilitet{--k:var(--k-mobilitet)} .k-kulde{--k:var(--k-kulde)} .k-meditation{--k:var(--k-meditation)} .k-tak{--k:var(--k-tak)} .k-crossfit{--k:var(--k-crossfit)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--fg);white-space:nowrap;background:var(--surface-2);padding:5px 10px 5px 8px;border-radius:999px}
.chip i{width:9px;height:9px;border-radius:50%;border:2px solid var(--k)}

.ex{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ex li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 14px;background:var(--surface-2);border-radius:16px;align-items:baseline}
.exn{font-weight:500}
.exp{font-weight:300;font-size:24px;letter-spacing:-.02em}
.exp small{font-weight:500;font-size:11px;color:var(--muted);margin-left:6px;letter-spacing:.02em}
.exl{grid-column:1/-1;font-size:13px;color:var(--muted)}
.sug{grid-column:1/-1;font-size:14px;font-weight:500;color:var(--accent);margin:0}
.sugb{color:var(--accent);font-weight:600}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:st}
.steps li{counter-increment:st;display:flex;gap:12px;align-items:baseline;padding:12px 14px;background:var(--surface-2);border-radius:16px}
.steps li::before{content:counter(st);font-weight:300;font-size:20px;color:var(--accent);min-width:14px}
.note{margin:0;font-size:14px;color:var(--muted);line-height:1.5}
.done-msg{margin:0;font-weight:500;color:var(--k-zone2);font-size:14px}

.btn{appearance:none;border:0;border-radius:999px;padding:16px 18px;font:500 16px/1 var(--font);cursor:pointer;width:100%;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--nav);color:#fff}
.btn.accent{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent)}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.danger{background:transparent;color:var(--k-interval);border:1px solid currentColor}
.btn.danger.armed{background:var(--k-interval);color:#fff}

/* week strip: circles like a calendar */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{appearance:none;border:0;background:transparent;padding:2px 0;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--fg);font:inherit;cursor:pointer;min-width:0}
.wd .dl{font-size:12px;font-weight:400;color:var(--muted);text-transform:capitalize}
.wd{border-radius:999px;padding:8px 0 10px}
.wd .dn{font-weight:500;font-size:16px;line-height:1}
.wd.is-today{background:var(--pill);color:var(--pill-fg)}
.wd.is-today .dl{color:inherit;opacity:.7}
.wd.is-today .bar{border-color:var(--pill-fg)}
.wd.is-today.is-done .bar{background:var(--pill-fg)}
.bar{width:10px;height:10px;border-radius:50%;border:2.5px solid var(--k);background:transparent;flex:none}
.is-done .bar{background:var(--k)}
.k-hvile .bar{border-width:0;width:4px;height:4px;background:var(--k-hvile);margin:3px}
.dial{position:relative;width:100%;max-width:300px;margin:0 auto}
.dial svg{width:100%;max-width:300px;height:auto;display:block}
.dial rect{stroke:none} .dial .seg-off{fill:var(--surface-2)} .dial .seg-on{fill:var(--accent)}
.dial-c{position:absolute;left:0;right:0;bottom:6%;text-align:center;display:flex;flex-direction:column;align-items:center}
.dial-c .ic{color:var(--accent);font-size:16px;line-height:1}
.dial-c b{font-weight:500;font-size:34px;letter-spacing:-.02em;line-height:1.1}
.dial-c span{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--surface);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);min-width:0}
.stat .lab{font-size:13px;color:var(--muted);font-weight:400}
.stat b{font-weight:300;font-size:34px;line-height:1.15;letter-spacing:-.02em}
.stat b small{font-size:15px;font-weight:400;color:var(--muted);margin-left:2px}
.stat .meter{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.stat .meter i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--k-zone2))}
.stat em{font-style:normal;font-size:12px;color:var(--muted)}
.delta{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;vertical-align:middle;margin-left:6px;background:var(--surface-2);color:var(--muted)}
.hab-list{display:flex;flex-direction:column;gap:8px}
.hab{appearance:none;border:0;width:100%;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 12px 10px 10px;border-radius:18px;background:var(--surface-2);color:var(--fg);font:inherit;text-align:left;cursor:pointer}
.hab-ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--k) 18%,transparent);color:var(--k)}
.hab-ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hab-t{display:flex;flex-direction:column;min-width:0}
.hab-t b{font-weight:500;font-size:16px}
.hab-t small{font-size:13px;color:var(--muted)}
.hab-ck{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--k);color:transparent;font-weight:700;font-size:15px}
.hab.done .hab-ck{background:var(--k);color:#fff}
.habit-head{display:flex;align-items:center;gap:12px}
.habit-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.habit-hero .tm-ring{--ring:var(--k)}
.habit-hero .tm-ring.warm{--ring:var(--k-interval)}
.habit-hero .tm-ring.warm .tm-ph{color:var(--k-interval)}
.dots7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dots7 span{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.dots7 i{width:12px;height:12px;border-radius:50%;border:2px solid var(--k)}
.dots7 i.on{background:var(--k)}
.tak-entry{padding:12px 0;border-top:1px solid var(--line)}
.tak-entry:first-child{border-top:0;padding-top:0}
.tak-entry p{margin:4px 0 0;white-space:pre-wrap;font-size:15px}
.fmt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fmt{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:18px;padding:14px;text-align:left;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.fmt b{font-weight:500;font-size:16px}
.fmt small{font-size:12px;color:var(--muted);line-height:1.35}
.fmt.on{background:var(--pill);color:var(--pill-fg);border-color:var(--pill)}
.fmt.on small{color:inherit;opacity:.7}
.fmt.any{grid-column:1/-1;border-style:dashed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{appearance:none;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:999px;padding:9px 14px;font:500 14px/1 var(--font);cursor:pointer}
.chips button.on{background:var(--pill);color:var(--pill-fg);border-color:var(--pill)}
.wod{background:var(--surface-2);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px}
.wod h3{margin:0;font-weight:600;font-size:22px;letter-spacing:-.01em}
.wod p{margin:0;font-size:16px}
.mvrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.mvrow:first-child{border-top:0;padding-top:0}
.mvrow b{font-weight:500}
.mvrow small{grid-column:1;font-size:12px;color:var(--muted)}
.mvrow .swap{grid-row:1/3;grid-column:2}
.alts{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;margin-top:8px}
.alts button{appearance:none;border:0;background:var(--surface-2);color:var(--fg);border-radius:12px;padding:11px 12px;font:500 14px/1.3 var(--font);text-align:left;cursor:pointer}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.rules li{display:grid;grid-template-columns:20px 1fr;gap:8px}
.rules li i{font-style:normal;color:var(--k-zone2);font-weight:700}
.rules li.warn i{color:var(--k-test)}
.goals{display:flex;flex-direction:column;gap:12px}
.goal{display:grid;grid-template-columns:1fr auto;gap:5px 10px;align-items:baseline}
.goal .gl{font-size:14px}
.goal .gv{font-size:14px;color:var(--muted)} .goal .gv b{color:var(--fg);font-weight:600}
.goal .gb{grid-column:1/-1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.goal .gb i{display:block;height:100%;border-radius:3px;background:var(--k)}
.goal.met .gv b{color:var(--k-zone2)}
.big-h{font-weight:300;font-size:44px;letter-spacing:-.03em;line-height:1}
.big-h small{font-size:16px;color:var(--muted);font-weight:400;margin-left:4px}
.progsw{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.progsw button{appearance:none;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:16px;padding:14px 12px;font:500 14px/1.3 var(--font);cursor:pointer;text-align:left}
.progsw button.on{background:var(--pill);color:var(--pill-fg);border-color:var(--pill)}
.progsw.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.tr-row{appearance:none;border:0;width:100%;display:flex;align-items:center;gap:10px;padding:15px 16px;border-radius:16px;background:var(--surface);color:var(--fg);font:500 16px/1.2 var(--font);text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.tr-row .nm{flex:1;min-width:0}
.tr-row .tag{font-size:12px;font-weight:500;color:var(--accent)}
.tr-row .muted-tag{color:var(--muted);font-weight:500}
.tr-row .chev{color:var(--muted);font-size:18px}
.tr-row.today{outline:2px solid var(--accent);outline-offset:-2px}
.exblk{padding:12px 0;border-top:1px solid var(--line);display:grid;gap:8px}
.exblk:first-of-type{border-top:0;padding-top:4px}
.exblk-top{display:grid;grid-template-columns:minmax(0,1fr) 40px 40px;gap:6px}
.exblk-top input{padding:10px 12px}
.exblk .rm{appearance:none;border:0;background:var(--surface-2);color:var(--muted);height:42px;border-radius:10px;cursor:pointer;font-size:16px}
.exmeta{font-size:12px;color:var(--muted);margin-top:-2px}
.exmeta.warn{color:var(--accent)}
.exnums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.exnums label{display:grid;gap:4px}
.exnums span{font-size:11px;color:var(--muted)}
.exnums input{padding:9px 6px;text-align:center}
.mvrow .rm.sw{appearance:none;border:0;background:var(--surface-2);color:var(--muted);width:40px;height:40px;border-radius:10px;cursor:pointer;font-size:16px}
.pk-grp{margin-bottom:6px}
.pk-grp[hidden],.pk-row[hidden]{display:none}
.pk-row{appearance:none;display:grid;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 2px;color:var(--fg);font:inherit;cursor:pointer;gap:2px}
.pk-row b{font-weight:600;font-size:15px}
.pk-row small{color:var(--muted);font-size:12px}
#pk-q{width:100%;margin-bottom:10px}
.exed{display:grid;grid-template-columns:minmax(0,1fr) 44px 44px 50px 30px;gap:6px;align-items:end}
.exed input{padding:10px 6px;text-align:center}
.exed input.exn-in{text-align:left;padding:10px 10px}
.exed span{font-size:11px;color:var(--muted);text-align:center}
.exed .rm{appearance:none;border:0;background:var(--surface-2);color:var(--muted);height:40px;border-radius:10px;cursor:pointer;font-size:16px}
.tr-grp{display:flex;flex-direction:column}
.tr-list{display:flex;flex-direction:column;gap:10px}
.tr-head{appearance:none;border:0;width:100%;display:flex;align-items:center;gap:10px;padding:18px 16px;border-radius:18px;background:var(--surface);color:var(--fg);font:600 17px/1.2 var(--font);text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.tr-head .nm{flex:1;min-width:0}
.tr-head .cnt{font-size:13px;font-weight:400;color:var(--muted)}
.tr-head .tag{font-size:12px;font-weight:500;color:var(--accent)}
.tr-head .chev{color:var(--muted);font-size:20px;transition:transform .2s;display:inline-block}
.tr-grp.open .tr-head .chev{transform:rotate(90deg)}
.tr-grp.open .tr-head{border-radius:18px 18px 6px 6px}
.tr-items{display:flex;flex-direction:column;gap:6px;margin-top:6px;padding-left:14px}
.tr-items .tr-row{padding:13px 14px;font-size:15px;box-shadow:none;background:var(--surface-2)}
.tr-head .bar,.tr-row .bar{flex:none}

.tr-card{background:var(--surface);border-radius:20px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;box-shadow:var(--shadow)}
.tr-card b{font-weight:500;font-size:17px;display:flex;align-items:center;gap:8px}
.tr-card small{font-size:13px;color:var(--muted);line-height:1.4;grid-column:1}
.tr-card .go{grid-row:1/3;grid-column:2;appearance:none;border:0;border-radius:999px;padding:11px 18px;font:500 14px/1 var(--font);cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
.tr-card.today{outline:2px solid var(--accent);outline-offset:-2px}
.tr-empty{appearance:none;border:1px dashed var(--line);background:transparent;color:var(--fg);border-radius:20px;padding:16px;font:500 16px/1 var(--font);cursor:pointer;text-align:left}
.wk{display:flex;flex-direction:column;gap:6px}
.wkrow{appearance:none;border:0;width:100%;display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--surface-2);color:var(--fg);font:inherit;text-align:left;cursor:pointer}
.wkrow .wd-d{font-weight:500;font-size:14px;color:var(--muted);text-transform:capitalize}
.wkrow .wd-n{display:flex;align-items:center;gap:8px;min-width:0;font-weight:500}
.wkrow .wd-n .bar{flex:none}
.wkrow small{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
.wkrow .chev{color:var(--muted);font-size:18px;transition:transform .15s}
.wkrow.open{background:var(--pill);color:var(--pill-fg)}
.wkrow.open .wd-d,.wkrow.open small,.wkrow.open .chev{color:inherit;opacity:.75}
.wkrow.open .chev{transform:rotate(90deg)}
.wkrow.rest .wd-n{color:var(--muted);font-weight:400}
.wkpick{display:flex;flex-direction:column;gap:12px;padding:12px 4px 8px}
.wkpick .lbl{font-size:12px;color:var(--muted);margin:0 0 6px}
.dayrow{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.dayrow:first-of-type{border-top:0;padding-top:0}
.dayrow b{font-weight:500;display:flex;align-items:center;gap:8px}
.dayrow select{padding:11px 10px;font-size:15px}
.progsw small{display:block;font-weight:400;font-size:12px;opacity:.7;margin-top:2px}
.banner{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);border-radius:22px;padding:16px 18px;box-shadow:var(--shadow)}
.banner .bi{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:13px;font-weight:600;margin-top:1px}
.banner p{margin:0;font-size:14px;line-height:1.45}
.banner b{font-weight:600;font-size:15px;display:block;margin-bottom:2px}
.banner button{appearance:none;border:0;background:rgb(255 255 255 / .22);color:inherit;border-radius:999px;padding:9px 14px;font:500 14px/1 var(--font);cursor:pointer;margin-top:10px}

.cal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.month{font-weight:500;font-size:22px;margin:0;text-transform:capitalize;letter-spacing:-.01em}
.icon-btn{appearance:none;border:0;background:var(--surface);color:var(--fg);width:44px;height:44px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer;flex:none;box-shadow:var(--shadow);display:grid;place-items:center}
.cal-card{padding:16px 12px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px 0}
.cw{text-align:center;font-size:12px;font-weight:400;color:var(--muted);padding-bottom:4px}
.cd{appearance:none;border:0;background:transparent;padding:9px 0 10px;width:44px;max-width:100%;justify-self:center;border-radius:999px;display:flex;flex-direction:column;align-items:center;gap:7px;font:inherit;color:var(--fg);cursor:pointer;min-width:0}
.cd .dn{font-weight:500;font-size:15px;line-height:1}
.cd.empty{cursor:default}
.cd.is-today .dn{color:var(--accent);font-weight:700}
.cd.is-sel{background:var(--pill);color:var(--pill-fg)}
.cd.is-sel .dn{color:inherit}
.cd.is-sel .bar{border-color:var(--pill-fg)}
.cd.is-sel.is-done .bar{background:var(--pill-fg)}
.cd.past:not(.is-done):not(.is-sel) .bar{opacity:.35}
.legend{display:flex;flex-wrap:wrap;gap:8px}

.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border-radius:999px;padding:5px;gap:4px;box-shadow:var(--shadow)}
.seg button{appearance:none;border:0;background:transparent;color:var(--muted);font:500 14px/1 var(--font);padding:11px 2px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--nav);color:#fff}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span,.trio span,.duo span{font-size:13px;font-weight:400;color:var(--muted)}
input,select,textarea{font:500 16px/1.3 var(--font);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;min-width:0}
.card input,.card select,.card textarea{background:var(--surface-2);border-color:transparent}
textarea{resize:vertical}
.trio,.duo,.quad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.duo{grid-template-columns:repeat(2,minmax(0,1fr))}
.trio label,.duo label{display:flex;flex-direction:column;gap:4px;min-width:0}
.formcard{gap:12px}

.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:24px minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) 46px;gap:6px;align-items:center;padding:6px;border-radius:16px;background:var(--surface-2)}
.set.head{background:transparent;padding-block:0}
.set.head span{font-size:11px;font-weight:400;color:var(--muted);text-align:center;line-height:1.15;align-self:end}
.set .sn{font-weight:300;font-size:20px;text-align:center;color:var(--muted)}
.card .set input{text-align:center;font-weight:500;padding:11px 4px;background:var(--surface);border-radius:12px}
.set input::placeholder{color:var(--muted);opacity:.7;font-weight:400}
.set .prev{grid-column:2/-1;font-size:12px;color:var(--muted);margin-top:-2px}
.chk{appearance:none;border:0;background:var(--surface);color:var(--muted);width:46px;height:44px;border-radius:12px;font-size:18px;font-weight:700;cursor:pointer}
.set.done{background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.set.done .chk{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
.set.done .sn{color:var(--accent)}
.setbtns{display:flex;gap:8px}
.setbtns .restbtn{flex:1}
.restbtn{appearance:none;border:0;background:var(--surface-2);color:var(--fg);border-radius:999px;padding:11px;font:500 14px/1 var(--font);cursor:pointer}
.restbar{position:fixed;left:50%;transform:translateX(-50%);width:min(calc(100% - 32px),488px);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--nav);color:#fff;padding:10px 10px 10px 20px;border-radius:999px;box-shadow:0 10px 30px rgb(0 0 0 / .25)}
#rest-t{font-weight:400;font-size:22px;color:var(--accent-2)}
.restbar button{appearance:none;border:0;background:rgb(255 255 255 / .12);color:#fff;border-radius:999px;padding:10px 16px;font:500 14px/1 var(--font);cursor:pointer}
.btns{display:grid;gap:8px}
.btns3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.btns3 .btn{padding:14px 6px}
.rt{margin:0;font-weight:500;font-size:17px}

/* timer: ring like an ECG recorder */
.timer{background:var(--surface);border-radius:28px;padding:22px 18px 26px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;box-shadow:var(--shadow);--ring:var(--muted)}
.timer.ph-work{--ring:var(--k-interval)} .timer.ph-rest{--ring:var(--k-zone2)} .timer.ph-easy{--ring:var(--accent)}
.timer .eyebrow{margin:0}
.tm-label{font-weight:500;font-size:22px;line-height:1.2;margin:0;text-wrap:balance}
.tm-ring{position:relative;width:min(72vw,280px);aspect-ratio:1;max-width:100%;margin:10px 0}
.tm-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tm-ring .trk{stroke:var(--surface-2)} .tm-ring .prg{stroke:var(--ring);transition:stroke-dashoffset .2s linear}
.tm-ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tm-time{font-weight:300;font-size:min(17vw,72px);line-height:1;margin:0;letter-spacing:-.03em}
.tm-ph{font-size:13px;font-weight:500;color:var(--ring)}
.tm-next{margin:0;font-size:14px;color:var(--muted)}

.rows{display:flex;flex-direction:column;gap:12px}
.srow{gap:12px;padding:16px}
.exin{font-weight:500;font-size:18px;background:transparent!important;border-color:transparent!important;padding:4px 2px}
.exin:focus{background:var(--surface-2)!important}
.x{appearance:none;border:0;background:var(--surface-2);color:var(--muted);width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;flex:none}
.hint{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
.field.inline{flex-direction:row;align-items:center;justify-content:space-between;gap:12px}
.field.inline>span{font-size:15px;color:var(--fg);font-weight:400}
.field.inline select{width:auto;max-width:62%}

.log{display:flex;flex-direction:column;gap:3px;padding:14px 0;border-top:1px solid var(--line)}
.log:first-child{border-top:0;padding-top:0}
.log:last-child{padding-bottom:0}
.log .meta{display:flex;align-items:center;gap:10px}
.log .lt{margin:0;font-weight:500}
.log .ld{margin:0;font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.del{appearance:none;border:0;background:var(--surface-2);color:var(--muted);font:500 13px var(--font);padding:7px 12px;border-radius:999px;cursor:pointer;margin-left:auto}
.del.confirm{background:var(--k-interval);color:#fff}

.big{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px}
.big b{font-weight:300;font-size:52px;line-height:1;letter-spacing:-.03em}
.big span{font-weight:400;color:var(--muted)}
.big em{font-style:normal;font-size:14px;color:var(--muted);flex-basis:100%}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}
.chart .ln{stroke:var(--k);stroke-width:2.4;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--k);opacity:.14}
.chart .pt{fill:var(--k)}
.chart .end{fill:var(--surface);stroke:var(--k);stroke-width:3}
.chart text{fill:var(--muted);font:400 10px var(--font)}
.chart text.ev{fill:var(--fg);font-weight:600;font-size:11px}
.empty{margin:0;color:var(--muted);font-size:14px}
.warn{margin:0;background:var(--k-interval);color:#fff;padding:12px 14px;border-radius:16px;font-weight:500;font-size:14px}
.facts{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}

/* floating dark pill nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.tabs .in{pointer-events:auto;max-width:380px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);background:var(--nav);border-radius:999px;padding:7px;box-shadow:0 12px 30px rgb(0 0 0 / .28)}
.tab{appearance:none;border:0;background:transparent;color:var(--nav-fg);font:500 11px/1 var(--font);height:56px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
.tab svg,.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs .in{position:relative}
.tab{position:relative;z-index:1;transition:color .25s}
.tab.on{color:#fff}
.tab{line-height:1.1;text-align:center;padding:0 2px;letter-spacing:-.01em}
.tab-ind{position:absolute;top:7px;bottom:7px;left:0;width:0;border-radius:999px;background:linear-gradient(135deg,var(--accent),var(--accent-2));transition:transform .38s cubic-bezier(.2,.8,.2,1),width .38s cubic-bezier(.2,.8,.2,1),opacity .2s;opacity:0;pointer-events:none}
html,body{overflow-x:clip}
html{background:var(--bg)}
/* The page only scrolls when content is taller than the screen; no rubber-band or pull-to-refresh */
html,body{height:100%;overscroll-behavior-y:none}
@media (prefers-reduced-motion:reduce){.tab-ind{transition:none}}
.tour{position:fixed;inset:0;z-index:20;background:rgb(0 0 0 / .55);display:flex;align-items:flex-end;justify-content:center}
.tour[hidden]{display:none}
.tour-box{background:var(--surface);color:var(--fg);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:18px 0 calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgb(0 0 0 / .3)}
.tour-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.tour-track::-webkit-scrollbar{display:none}
.tour-slide{flex:0 0 100%;scroll-snap-align:center;padding:8px 28px 4px;text-align:center}
.tour-ic{width:72px;height:72px;border-radius:22px;margin:6px auto 16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
.tour-ic svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tour-slide h3{margin:0 0 8px;font-size:22px}
.tour-slide p{margin:0;color:var(--muted);font-size:15px;line-height:1.45;min-height:66px}
.tour-dots{display:flex;gap:6px;justify-content:center;margin:14px 0}
.tour-dots i{width:7px;height:7px;border-radius:99px;background:var(--line);transition:width .2s,background .2s}
.tour-dots i.on{width:20px;background:var(--accent)}
.tour-btns{display:flex;gap:10px;padding:0 20px}
.tour-btns button{flex:1}
.ac{position:absolute;z-index:15;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgb(0 0 0 / .35);overflow:hidden;max-height:300px;overflow-y:auto}
.ac[hidden]{display:none}
.ac button{appearance:none;display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:13px 14px;color:var(--fg);font:500 15px/1.25 var(--font);cursor:pointer}
.ac button:first-child{border-top:0}
.ac button small{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:2px}
.ac button:active{background:var(--surface-2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom,0px));background:var(--nav);color:#fff;padding:11px 18px;border-radius:999px;font-weight:500;font-size:14px;z-index:6;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 30px rgb(0 0 0 / .25)}

/* ---------- Type scale (one place, wins over earlier rules) ----------
   display 28/600 · title 20/600 · heading 16/600 · body 15/400 · item 15/500 · label 13/500 · caption 12/500 · hero numbers 44/500 */
body{font-size:15px;line-height:1.45}

<script>

const SESS={
  A:{name:'Styrke A',kind:'styrke',dur:'ca. 60 min',ex:[['Squat',4,5,2],['Bænkpres',4,5,2],['Rotræk med stang',3,8,1],['Bulgarsk splitsquat',3,8,2],['Farmer\'s walk (meter)',3,40,1]],

  Z2:{name:'Zone 2',kind:'zone2',dur:'45–60 min',

  I5:{name:'Intervaller 5×4',kind:'interval',dur:'ca. 47 min',
     steps:['10 min roligt for at varme op','5 × 4 min hårdt. Det hårdeste tempo, du kan holde jævnt hele vejen. Ikke en sprint.','3 min roligt jog eller gang mellem hvert interval','5 min roligt til sidst','Tjek: Du kan sige 2–3 ord ad gangen. Interval 5 skal være lige så hurtigt som interval 1.'],
     note:'Et ekstra interval i forhold til 4×4. Løb er fint, hvis dagen før var let for benene.'},
  I30B:{name:'Korte intervaller 30/15 · 4 serier',kind:'interval',dur:'ca. 50 min',
     steps:['10 min roligt for at varme op','4 serier. Hver serie er 10 runder: 30 sek hurtigt + 15 sek langsomt','3 min roligt mellem serierne','5 min roligt til sidst','De 30 sek er hurtige, men ikke en sprint. Du skal kunne holde samme fart i alle runder.'],
     note:'Tag det på cykel eller romaskine. Så slipper benene for 40 hårde løbestød, og styrken lider mindre. Fjerde serie giver flere hårde minutter.'},
  Z2L:{name:'Zone 2 · 60 min',kind:'zone2',dur:'60 min',
     steps:['60 min march med oppakning, cykel, ro eller roligt løb','60–70 % af maks puls','Du skal kunne tale i hele sætninger'],
     note:'Bygger den aerobe base, som gør intervallerne bedre. Hold det roligt hele vejen.'},
  MOB:{name:'Mobilitet',kind:'mobilitet',dur:'10 min',min:10,

     note:'Lige efter styrkepasset, mens du er varm.'},
  BAL:{name:'Balance og mobilitet',kind:'mobilitet',dur:'15 min',min:15,
     steps:['Etbensstand med lukkede øjne · 3 × 30 sek pr. ben','Etbens rumænsk dødløft · 2 × 8 pr. ben','Kosakker-squat · 2 × 6 pr. side','Tå-gang og hæl-gang · 2 × 20 m','Hoftebøjer- og baglårsstræk · 1 min pr. side','Rolig vejrtrækning på ryggen · 2 min'],
     note:'Balance holder ankler, knæ og hofter skadefri.'},
  AR1:{name:'Restitutionstur',kind:'mobilitet',label:'Aktiv restitution',dur:'25 min',min:25,
     steps:['25 min gang, cykel eller svømning i meget roligt tempo','Under 60 % af maks puls · hårdhed 2–3 af 10','Du skal kunne synge eller føre en samtale uden pause'],
     note:'Let bevægelse øger blodgennemstrømningen uden at give ny træthed. Bedst dagen efter et hårdt pas.'},
  AR2:{name:'Cykel-flush',kind:'mobilitet',label:'Aktiv restitution',dur:'20 min',min:20,
     steps:['5 min meget roligt','3 × (3 min let modstand og høj kadence, 90–100 omdr./min + 1 min helt roligt)','3 min roligt til sidst','Hold pulsen under 65 % af maks'],
     note:'Høj kadence med lav modstand får blodet rundt i benene uden at belaste musklerne. Godt efter tunge ben-dage.'},
  AR3:{name:'Rul og stræk',kind:'mobilitet',label:'Aktiv restitution',dur:'20 min',min:20,
     steps:['Foam roller · 60–90 sek pr. område: lægge, lår forside, baglår, baller, øvre ryg','Rul langsomt og stop 10 sek på ømme punkter. Det må gerne ømme, ikke gøre ondt','Hoftebøjerstræk · 2 × 30 sek pr. side','Baglårsstræk · 2 × 30 sek pr. side','Bryststræk i dørkarm · 2 × 30 sek'],
     note:'Foam rolling kan mindske ømhed og give bedre bevægelighed i timerne efter. Drik vand bagefter.'},
  AR4:{name:'Let kropsvægtcirkel',kind:'mobilitet',label:'Aktiv restitution',dur:'20 min',min:20,
     steps:['3 runder i roligt tempo:','10 air squats','10 glute bridges','8 bird dogs pr. side','10 vægarmstræk (armene op ad væggen)','20 sek dead bug','1 min march på stedet','Hårdhed 3–4 af 10. Du skal ikke blive forpustet'],
     note:'Holder bevægemønstrene i gang og løsner stive led uden at belaste. Ingen vægte.'},
  AR5:{name:'Rolig yoga og vejrtrækning',kind:'mobilitet',label:'Aktiv restitution',dur:'15 min',min:15,
     steps:['Kat-ko · 1 min','Nedadgående hund · 5 rolige vejrtrækninger','Lav lunge · 5 vejrtrækninger pr. side','Barnets stilling · 1 min','Liggende rotation · 1 min pr. side','Vejrtrækning på ryggen · 2 min: 4 sek ind, 6 sek ud'],
     note:'Lang udånding sænker pulsen og hjælper kroppen ned i gear. Godt om aftenen.'},
  S:{name:'Styrke',kind:'styrke',dur:'ca. 60 min',steps:['Appen vælger dagens styrkepas.'],note:''},
  CF:{name:'CrossFit',kind:'crossfit',dur:'',steps:['Vælg format og tid, og byg dagens pas.'],note:''},
  R:{name:'Hvile',kind:'hvile',dur:'',steps:['Gåtur eller let mobilitet','Søvn og mad er dagens træning'],note:''}
};
const DEFAULT_PLAN={0:'R',1:'A',2:'I4',3:'B',4:'Z2',5:'C',6:'I30'};
/* Bryan Johnson Blueprint: 6 h/week, 3 strength + 3 cardio, 150 min zone 2, 75 min vigorous, mobility and balance */
const BP_PLAN={0:'Z2L',1:'A',2:'I5',3:'B',4:'Z2L',5:'I30B',6:'C'};
const BP_ADDONS={1:'MOB',3:'MOB',6:'MOB',0:'BAL'};
const DELOAD_EVERY=5;
const IC={
  kulde:'<svg viewBox="0 0 24 24"><path d="M12 2v20M4.5 6.5l15 11M19.5 6.5l-15 11M9 4l3 2 3-2M9 20l3-2 3 2"/></svg>',
  meditation:'<svg viewBox="0 0 24 24"><circle cx="12" cy="6" r="2.5"/><path d="M4 18c3-1 5-2 8-2s5 1 8 2M7 14l5-3 5 3"/></svg>',
  tak:'<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg>'};
/* Habits progress weekly from the week you started: cold +15 s/week to 10 min, meditation +2 min/week to 30 min */
const HABITS=[
  {id:'kulde',name:'Koldt bad',unit:'sek',target:w=>Math.min(600,15*(w+1)),
   tips:['Start med et varmt bad, så længe du har lyst. Sæt den varme opstart til det, du har brug for.','Mens vandet er varmt, så slap af i kroppen og træk vejret langsomt.','Når timeren bipper, så skift til koldt vand.','Start kort og øg tiden gradvist. Appen lægger 15 sek på hver uge.','Gør det til en daglig vane. Det er gentagelsen, der bygger tolerancen.','Tag det ikke lige efter styrketræning. Kulde kan dæmpe muskelvæksten, så vent mindst 4–6 timer.','Stop med det samme, hvis du bliver svimmel eller følelsesløs.']},
  {id:'meditation',name:'Meditation',unit:'min',target:w=>Math.min(30,10+2*w)*60,
   tips:['Sid oprejst, luk øjnene og følg vejret ind og ud.','Når tankerne vandrer, så læg mærke til det og vend roligt tilbage til vejret.','Samme tid hver dag gør det lettere at holde fast i.']},
  {id:'tak',name:'Taknemmelighed',unit:'',target:()=>0,
   tips:['Skriv i nutid, som om det allerede er sket: "Jeg er taknemmelig for, at jeg ..."','Skriv det fysisk ned på papir. Tryk så "Skrevet i dag".']}];
const HCOLORS=['#E5484D','#30A46C','#0091FF','#F5A524','#8E4EC6','#12A594','#E93D82'];
function habits(){return HABITS.concat((state.customHabits||[]).map(c=>({id:c.id,name:c.name,custom:true,check:c.kind==='check',color:c.color,since:c.since,unit:'min',
  target:w=>c.kind==='check'?0:Math.round(Math.min(c.maxMin,c.startMin+c.stepMin*w)*60),
  tips:c.note?c.note.split('\n').filter(Boolean):(c.kind==='check'?['Markér vanen, når du har gjort den.']:['Start timeren, og lad alarmen fortælle dig, når du er færdig.'])})))}
const findHabit=id=>habits().find(x=>x.id===id);
const hw=(h,d)=>h&&h.since?Math.max(0,Math.floor((pd(weekDates(d)[0])-pd(h.since))/(7*864e5))):habitWeek(d);
const habitWeek=d=>state.habitStart?Math.max(0,Math.floor((pd(weekDates(d)[0])-pd(state.habitStart))/(7*864e5))):0;
const habitDone=(id,d)=>logsOn(d).some(l=>l.type===id);
function habitStreak(id){let n=0,d=pd(TODAY);if(!habitDone(id,TODAY))d.setDate(d.getDate()-1);for(;;){if(habitDone(id,ds(d))){n++;d.setDate(d.getDate()-1)}else break}return n}
function habitTargetText(h,d){if(h.id==='tak')return 'Skriv 3 ting som om de er sket';if(h.check)return 'Afkryds når den er gjort';const t=h.target(hw(h,d||TODAY));return h.id==='kulde'||t<60||t%60?fmtTime(t):Math.round(t/60)+' min'}
const BP_GOALS={total:360,z2:150,vig:75,str:3,mob:45};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
let TODAY=ds(new Date());
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isFinite(n)?n:null};
const fnum=(n,dec=1)=>(Math.round(n*10**dec)/10**dec).toString().replace('.',',');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function parseTime(s){s=String(s??'').trim();if(!s)return null;const p=s.split(/[:.]/).map(x=>num(x));if(p.some(x=>x===null))return null;return p.reduce((a,b)=>a*60+b,0)}
function fmtTime(sec){sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${h}:${pad(m)}:${pad(s)}`:`${m}:${pad(s)}`}
const e1rm=(kg,reps)=>kg*(1+reps/30);
const niceDate=s=>{const d=pd(s);return `${DAYS[d.getDay()]} ${d.getDate()}. ${MONTHS[d.getMonth()]}`};
const shortDate=s=>{const d=pd(s);return `${d.getDate()}/${d.getMonth()+1}`};
const fmtVal=(v,u)=>u==='tid'?fmtTime(v):fnum(v,2)+' '+u;
const chip=(k,label)=>`<span class="chip k-${k}"><i></i>${label}</span>`;

/* ---------- storage ---------- */
let storageOK=true;
try{localStorage.setItem('__t','1');localStorage.removeItem('__t')}catch(e){storageOK=false}
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);
    const st={plan:{...DEFAULT_PLAN,...(d.plan||{})},logs:Array.isArray(d.logs)?d.logs:[],lastBackup:d.lastBackup||null,program:d.program,addons:d.addons||{}};
    if(st.program==='blueprint'&&st.plan[2]==='I4'&&st.plan[0]==='Z2L')st.plan[2]='I5';
    /* v9: move 30/15 to Friday and Styrke C to Saturday, so intervals never follow a heavy leg day */
    if(st.program==='blueprint'&&st.plan[5]==='C'&&st.plan[6]==='I30B'){st.plan[5]='I30B';st.plan[6]='C';if(st.addons[5]==='MOB'){delete st.addons[5];st.addons[6]='MOB'}}
    st.cycleStart=d.cycleStart||null;if(st.program==='blueprint'&&!st.cycleStart)st.needCycle=true;st.hrmax=d.hrmax||null;st.habitStart=d.habitStart||null;st.coldPre=d.coldPre;st.customHabits=Array.isArray(d.customHabits)?d.customHabits:[];st.skips=d.skips||{};st.sessEdits=d.sessEdits||{};st.customSess=d.customSess||{};st.customPlan=d.customPlan||null;st.customAddons=d.customAddons||null;st.customDeload=d.customDeload;st.overrides=d.overrides||{};st.cfDays=d.cfDays||{};st.cfPrefs=d.cfPrefs||null;st.strUdstyr=d.strUdstyr||null;st.strGen=d.strGen||null;st.fw=d.fw||null;st.seGen=d.seGen||null;st.theme=d.theme||'auto';st.accent=d.accent||'orange';st.goals=d.goals||[];st.fwT=d.fwT||60;st.block=d.block||null;st.blockDays=d.blockDays||{};st.planSess=d.planSess||{};st.planFw=d.planFw||{};st.shifts=Array.isArray(d.shifts)?d.shifts:[];
    if(!st.program){const untouched=Object.keys(DEFAULT_PLAN).every(k=>st.plan[k]===DEFAULT_PLAN[k]);if(untouched)st.plan={...BP_PLAN};st.addons={...BP_ADDONS}}
    /* v20: one program only — your own week. Existing data counts as already set up. */
    if(st.program!=='custom'&&!d.customPlan)st.customDeload=d.customDeload??true;
    ['plan','customPlan'].forEach(f=>{if(st[f])for(const d in st[f])if(['A','B','C'].includes(st[f][d]))st[f][d]='S'});
    st.program='custom';st.onboarded=d.onboarded!==false;st.tipSeen=d.tipSeen!=null?d.tipSeen:d.onboarded!==false;st.tourSeen=d.tourSeen!=null?d.tourSeen:d.onboarded!==false;st.name=d.name!=null?d.name:'Mikkel';
    return st}}catch(e){}
  return {plan:{0:'R',1:'R',2:'R',3:'R',4:'R',5:'R',6:'R'},logs:[],program:'custom',addons:{},cycleStart:null,hrmax:null,habitStart:null,onboarded:false,name:'',customDeload:true};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true}catch(e){storageOK=false}}
let state=load();
/* Your own sessions and edits to built-in ones live in state; SESS is rebuilt from the built-ins plus these */
const SESS_BASE=JSON.parse(JSON.stringify(SESS));
function applySess(){Object.keys(SESS).forEach(k=>{if(!SESS_BASE[k])delete SESS[k]});
  for(const k in SESS_BASE)SESS[k]=JSON.parse(JSON.stringify(SESS_BASE[k]));
  for(const [k,e] of Object.entries(state.sessEdits||{}))if(SESS[k])Object.assign(SESS[k],e);
  for(const [k,c] of Object.entries(state.customSess||{}))SESS[k]={...c,custom:true};
  for(const [k,c] of Object.entries(state.planSess||{}))SESS[k]={...c,plan:true}}
applySess();
/* Theme and accent colour chosen in settings */
const ACCENTS={orange:['Orange','#FF7A2E','#FFA766'],blaa:['Blå','#3B82F6','#7FB0FF'],groen:['Grøn','#10B981','#5EE0B5'],lilla:['Lilla','#8B5CF6','#B9A0FF'],pink:['Pink','#EC4899','#F7A1CC'],roed:['Rød','#EF4444','#FF8A8A']};
function applyLook(){const r=document.documentElement;if(state.theme==='dark'||state.theme==='light')r.dataset.theme=state.theme;else delete r.dataset.theme;
  const a=ACCENTS[state.accent];if(a&&state.accent!=='orange'){r.style.setProperty('--accent',a[1]);r.style.setProperty('--accent-2',a[2])}else{r.style.removeProperty('--accent');r.style.removeProperty('--accent-2')}
  const dark=state.theme==='dark'||(state.theme!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.querySelectorAll('meta[name=theme-color]').forEach(m=>m.setAttribute('content',dark?'#0F1012':'#ECEDEF'))}
applyLook();
const customKeys=kind=>Object.keys(state.customSess||{}).filter(k=>state.customSess[k].kind===kind);

/* ---------- data queries ---------- */

function chart(pts,fmt,kind){
  if(pts.length<2)return `<p class="empty">${pts.length?'Log én gang mere for at se en kurve.':'Ingen data endnu.'}</p>`;
  pts=[...pts].sort((a,b)=>a.x-b.x);
  const W=320,H=130,pl=6,pr=6,pt=20,pb=20;
  let x0=pts[0].x,x1=pts[pts.length-1].x;if(x1===x0)x1=x0+1;
  const ys=pts.map(p=>p.y);let y0=Math.min(...ys),y1=Math.max(...ys);if(y1===y0){y0-=1;y1+=1}const py=(y1-y0)*.15;y0-=py;y1+=py;
  const X=x=>pl+(x-x0)/(x1-x0)*(W-pl-pr),Y=y=>pt+(1-(y-y0)/(y1-y0))*(H-pt-pb);
  const line=pts.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  const area=line+` L${X(pts[pts.length-1].x).toFixed(1)} ${H-pb} L${X(x0).toFixed(1)} ${H-pb} Z`;
  const last=pts[pts.length-1],lx=X(last.x),ly=Y(last.y);
  const grid=[0,.5,1].map(f=>{const y=(pt+f*(H-pt-pb)).toFixed(1);return `<line class="grid" x1="0" x2="${W}" y1="${y}" y2="${y}"/>`}).join('');
  const dots=pts.length<=24?pts.slice(0,-1).map(p=>`<circle class="pt" cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="2.2"/>`).join(''):'';
  const fd=d=>{const t=new Date(d);return `${t.getDate()}/${t.getMonth()+1}`};
  return `<svg class="chart k-${kind}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Udvikling over tid">${grid}<path class="ar" d="${area}"/><path class="ln" d="${line}"/>${dots}<circle class="end" cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="4.5"/>
  <text class="ev" x="${Math.min(lx,W-2).toFixed(1)}" y="${Math.max(ly-9,11).toFixed(1)}" text-anchor="end">${fmt(last.y)}</text>
  <text x="0" y="${H-4}">${fd(pts[0].x)}</text><text x="${W}" y="${H-4}" text-anchor="end">${fd(last.x)}</text></svg>`;
}

let actx;
function beep(freq=880,dur=.15,vol=.3){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
    const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;o.type='square';o.frequency.value=freq;o.connect(g);g.connect(actx.destination);

  const P=[],add=(label,sec,type)=>P.push({label,sec,type});
  if(key==='I4'||key==='I5'){const n=key==='I5'?5:4;add('Opvarmning',600,'easy');for(let i=1;i<=n;i++){add(`Interval ${i} af ${n} · hårdt`,240,'work');if(i<n)add('Aktiv pause',180,'rest')}add('Nedvarmning',300,'easy')}
  else if(key==='I30'){add('Opvarmning',600,'easy');for(let s=1;s<=3;s++){for(let r=1;r<=10;r++){add(`Serie ${s} · ${r}/10 · hårdt`,30,'work');if(r<10)add(`Serie ${s} · ${r}/10 · let`,15,'rest')}if(s<3)add('Seriepause',180,'rest')}add('Nedvarmning',300,'easy')}
  else if(key==='I30B'){add('Opvarmning',600,'easy');for(let s=1;s<=4;s++){for(let r=1;r<=10;r++){add(`Serie ${s} · ${r}/10 · hårdt`,30,'work');if(r<10)add(`Serie ${s} · ${r}/10 · let`,15,'rest')}if(s<4)add('Seriepause',180,'rest')}add('Nedvarmning',300,'easy')}
  else if(SESS[key]&&SESS[key].custom){const S=SESS[key];add(S.name,Math.max(60,(S.min||30)*60),S.kind==='interval'?'work':'easy')}

    case 'skipday':state.skips={...(state.skips||{}),[TODAY]:true};ui.skipAsk=false;save();render();toast('Dagens pas er sprunget over');break;
    case 'shiftday':{const name=sessFor(TODAY).name;state.skips={...(state.skips||{}),[TODAY]:true};state.shifts=(state.shifts||[]).concat(TODAY);ui.skipAsk=false;save();render();toast(name+' er rykket til i morgen');break}
    case 'unskip':{const sk={...(state.skips||{})};delete sk[TODAY];state.skips=sk;state.shifts=(state.shifts||[]).filter(x=>x!==TODAY);save();render();toast('Fortrudt');break}
    case 'coldpre':state.coldPre=+b.dataset.v;save();render();break;
    case 'manlog':{const h=findHabit(ui.habit),raw=String(ui.manVal||'').trim(),date=ui.manDate||TODAY;
      if(h.check){if(habitDone(h.id,date)){toast('Allerede logget den dag');break}state.logs.push({id:Date.now().toString(36),date,type:h.id,manual:true});save();render();toast('Logget');break}
      let sec=h.id==='kulde'?parseTime(raw):(num(raw)!=null?num(raw)*60:null);if(raw==='')sec=h.target(hw(h,date));
      if(!sec||sec<5){toast(h.id==='kulde'?'Skriv tiden som m:ss, fx 0:45':'Skriv antal minutter');break}
      state.logs.push({id:Date.now().toString(36),date,type:h.id,sec:Math.round(sec),manual:true});save();ui.manVal='';render();toast(`Logget · ${fmtTime(sec)}`);break}
    case 'htstop':htFinish(false);break;
    case 'taksave':{const txt=(ui.takText||'').trim();const ex=state.logs.find(l=>l.type==='tak'&&l.date===TODAY);if(ex){if(txt)ex.text=txt}else state.logs.push({id:Date.now().toString(36),date:TODAY,type:'tak',text:txt});ui.takText='';save();render();toast('Gemt');break}
    case 'habitreset':state.habitStart=mondayOf(TODAY);save();render();toast('Vaner starter forfra i uge 1');break;
    case 'cyclereset':state.cycleStart=mondayOf(TODAY);save();render();toast('Uge 1 af '+DELOAD_EVERY);break;
    case 'wkopen':ui.wkOpen=ui.wkOpen===b.dataset.v?null:(b.dataset.v||null);render();break;
    case 'wkset':case 'wkadd':{const ob=b.dataset.ctx==='ob',d=b.dataset.d,v=b.dataset.v;const P=ob?ui.ob.plan:state.plan;let A=ob?ui.ob.addons:{...(state.addons||{})};
      if(a==='wkset'){P[d]=v;const kk=SESS[v].kind;if(kk==='hvile'||kk==='mobilitet')delete A[d]}else{if(v)A[d]=v;else delete A[d]}
      if(ob)ui.ob.addons=A;else{state.addons=A;syncCustom();save()}render();break}
    case 'tournext':{const tr=$('#tour-track'),i=Math.round(tr.scrollLeft/tr.clientWidth);if(i>=TOUR.length-1)endTour();else tr.scrollTo({left:(i+1)*tr.clientWidth,behavior:'smooth'});break}
    case 'tourend':endTour();break;
    case 'tourshow':showTour();break;
    case 'tipok':state.tipSeen=true;save();render();break;
    case 'obstart':obInit();ui.view='onboard';render(true);break;
    case 'obn':ui.ob.n=+b.dataset.v;render();break;
    case 'obpick':ui.ob.pick=+b.dataset.d;render();break;
    case 'obclose':ui.ob.pick=null;render();break;
    case 'obset':{const o=ui.ob,d=o.pick,t=b.dataset.v;if(plTypeOfKey(o.plan[d])!==t){o.plan[d]=OB_KEY[t];if(!['styrke','crossfit'].includes(t))delete o.addons[d]}o.pick=null;render();break}
    case 'obgoal':{const g=b.dataset.v,o=ui.ob;o.goals=o.goals.includes(g)?o.goals.filter(x=>x!==g):o.goals.concat(g);render();break}
    case 'obnext':{const o=ui.ob;if(o.step===2){const sug=obSuggest(OB_SPREAD[o.n],o.goals);o.plan=sug.plan;o.addons=sug.addons}o.step++;render(true);break}
    case 'obback':ui.ob.step--;render(true);break;
    case 'obdone':{replaceNext=true;const o=ui.ob;state.plan={...o.plan};state.addons={...o.addons};state.program='custom';state.name=o.name.trim();state.onboarded=true;state.shifts=[];state.skips={};state.overrides=state.overrides||{};
      state.cycleStart=mondayOf(TODAY);syncCustom();save();ui.ob=null;ui.view='today';render(true);if(!state.tourSeen)showTour();else toast('Din uge er klar');break}
    case 'customfrom':{const bp=b.dataset.p==='blueprint';state.plan=bp?{...BP_PLAN}:{...DEFAULT_PLAN};state.addons=bp?{...BP_ADDONS}:{};syncCustom();save();render();toast('Kopieret. Ret dagene til.');break}
    case 'program':if(b.dataset.p==='custom'){if(state.program!=='custom'){state.plan=state.customPlan?{...state.customPlan}:{...state.plan};state.addons=state.customAddons?{...state.customAddons}:{...(state.addons||{})};state.program='custom';if(!state.cycleStart)state.cycleStart=mondayOf(TODAY);syncCustom();save()}render();toast('Egen plan valgt');break}
    {const bp=b.dataset.p==='blueprint';state.program=bp?'blueprint':'egen';state.plan=bp?{...BP_PLAN}:{...DEFAULT_PLAN};state.addons=bp?{...BP_ADDONS}:{};state.cycleStart=mondayOf(TODAY);save();render();toast(bp?'Blueprint-program valgt':'Standardplan valgt');break}
    case 'mobdone':{const k=b.dataset.key,d=b.dataset.date||TODAY,S=SESS[k];state.logs.push({id:Date.now().toString(36),date:d,type:'mobilitet',name:S.name,dur:S.min*60});save();render();toast('Gemt');break}
    case 'copy':doCopy();break;
    case 'restore':doRestore();break;
    case 'wipe':if(ui.pendingWipe){state.logs=[];save();ui.pendingWipe=false;toast('Alle logs slettet')}else ui.pendingWipe=true;render();break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.ac)acShow(t);
  if(t.id==='pk-q'){const q=t.value.trim().toLowerCase();document.querySelectorAll('.pk-row').forEach(r=>r.hidden=!!q&&!r.dataset.q.includes(q));document.querySelectorAll('.pk-grp').forEach(g=>g.hidden=![...g.querySelectorAll('.pk-row')].some(r=>!r.hidden));return}
  if(t.dataset.row!==undefined){const r=ui.rows[+t.dataset.row];if(r){r[t.dataset.f]=t.value;ui.dirty=true}return}
  if(t.dataset.set!==undefined){const [i,j]=t.dataset.set.split('.').map(Number),r=ui.rows[i];if(!r)return;const s=r.sets[j],f=t.dataset.f,old=s[f];s[f]=t.value;ui.dirty=true;
    /* changing kg or reps carries forward to later sets that aren't done and still had the old value */
    if(f!=='rir')for(let k=j+1;k<r.sets.length;k++){const n=r.sets[k];if(!n.done&&n[f]===old){n[f]=t.value;const el=$(`#s${i}-${k}-${f}`);if(el)el.value=t.value}}
    saveDraft();return}
  if(t.dataset.bind){const path=t.dataset.bind.split('.'),o=path[0];let tgt=ui;for(let i=0;i<path.length-1;i++)tgt=tgt[path[i]];tgt[path[path.length-1]]=t.value;if(o!=='impText'&&o!=='cf')ui.dirty=true}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='f-date'){ui.logDate=t.value||TODAY;const key=sessKey(ui.logDate);
    if(ui.logType==='styrke'&&['A','B','C'].includes(key)&&key!==ui.sess){ui.sess=key;initRows(key)}
    if(ui.logType==='kondition'&&['I4','I5','I30','I30B','Z2','Z2L'].includes(key))ui.k.sess=key;render()}
  else if(t.id==='f-sess'){ui.sess=t.value;if(t.value!=='X')initRows(t.value);else ui.rows=[makeRow('',3,8,2)];render()}
  else if(t.dataset.row!==undefined&&t.dataset.f==='ex'){const i=+t.dataset.row,r=ui.rows[i];
    if(r&&!r.sets.some(s=>s.done)){const tg=target(t.value);ui.rows[i]=makeRow(t.value.trim(),r.sets.length,tg?tg.reps:r.tReps,tg?tg.rir:r.tRir);render()}}
  else if(t.id==='hrmax'){const v=parseInt(t.value);state.hrmax=v>=140&&v<=230?v:null;save();render();toast(state.hrmax?'Makspuls gemt':'Skriv et tal mellem 140 og 230')}
  else if(t.dataset.plan!==undefined){state.plan[t.dataset.plan]=t.value;const kk=SESS[t.value].kind;if(kk==='hvile'||kk==='mobilitet'){const a={...(state.addons||{})};delete a[t.dataset.plan];state.addons=a}syncCustom();save();render();toast('Ugeplan opdateret')}
  else if(t.dataset.obplan!==undefined){const d=t.dataset.obplan,o=ui.ob;o.plan[d]=t.value;const kk=SESS[t.value].kind;if(kk==='hvile'||kk==='mobilitet')delete o.addons[d];render()}
  else if(t.dataset.obaddon!==undefined){const d=t.dataset.obaddon,o=ui.ob;if(t.value)o.addons[d]=t.value;else delete o.addons[d]}
  else if(t.id==='nm'){state.name=t.value.trim();save();render()}
  else if(t.dataset.addon!==undefined){const a={...(state.addons||{})};if(t.value)a[t.dataset.addon]=t.value;else delete a[t.dataset.addon];state.addons=a;syncCustom();save();toast('Ugeplan opdateret')}
  else if(t.dataset.cdeload!==undefined){state.customDeload=t.value==='1';save();render()}
  else if(t.id==='p-ex'){ui.progEx=t.value;render()}
  else if(t.id==='p-test'){ui.progTest=t.value;render()}
  else if(t.id==='t-unit'){ui.t.unit=t.value;render()}
  else if(t.id==='t-name'){ui.t.name=t.value;if(t.value.trim())ui.t.unit=guessUnit(t.value.trim());render()}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(timer&&!timer.paused)keepAwake();const n=ds(new Date());if(n!==TODAY){TODAY=n;render()}}});

if(state.onboarded&&!state.cycleStart){delete state.needCycle;state.cycleStart=mondayOf(TODAY);save()}
if(!state.habitStart){state.habitStart=mondayOf(TODAY);save()}
render();
</script>
